services:
    backend:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: emis-app-backend
        restart: unless-stopped
        working_dir: /var/www/html
        entrypoint: ["/var/www/html/docker/entrypoint.sh"]
        volumes:
            - .:/var/www/html
            - vendor:/var/www/html/vendor
            - storage_data:/var/www/html/storage/app/public
        ports:
            - "${APP_PORT:-8090}:80"
        env_file:
            - .env
        environment:
            SERVER_NAME: ":80"
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE:-emis}
            DB_USERNAME: ${DB_USERNAME:-root}
            DB_PASSWORD: ${DB_PASSWORD:-}
            REDIS_HOST: redis
            REDIS_PORT: 6379
            REDIS_CLIENT: predis
            CACHE_STORE: redis
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started
        networks:
            - emis

    # nginx:
    #     image: nginx:alpine
    #     container_name: emis-nginx-backend
    #     restart: unless-stopped
    #     ports:
    #         - "${APP_PORT:-8090}:80"
    #     volumes:
    #         - .:/var/www/html:ro
    #         - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    #         - storage_data:/var/www/html/storage/app/public:ro
    #     depends_on:
    #         - backend
    #     networks:
    #         - emis

    mysql:
        image: mysql:8.0
        container_name: emis-mysql-backend
        restart: unless-stopped
        ports:
            - "${DB_EXTERNAL_PORT:-3308}:3306"
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-}
            MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
            MYSQL_DATABASE: ${DB_DATABASE:-emis}
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
            interval: 5s
            timeout: 5s
            retries: 12
        networks:
            - emis

    redis:
        image: redis:7-alpine
        container_name: emis-redis-backend
        restart: unless-stopped
        ports:
            - "6379:6379"
        networks:
            - emis

    composer:
        image: composer:2
        container_name: emis-composer
        working_dir: /app
        volumes:
            - .:/app
        entrypoint: ["composer"]
        profiles: ["tools"]

volumes:
    mysql_data:
    vendor:
    storage_data:

networks:
    emis:
        driver: bridge
