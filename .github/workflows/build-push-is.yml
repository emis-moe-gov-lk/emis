name: Build and Push WSO2 IS Image
run-name: "Build & Push WSO2 IS image on ${{ github.ref_name }}"

on:
  workflow_dispatch: # trigger workflow manually
  workflow_call:    # trigger workflow from an external workflow

jobs:
  build-is:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      variables: write 

    # Centralized configuration blocks matching frontend and backend layout
    env:
      REGISTRY_BASE: "ghcr.io/${{ github.repository_owner }}/emis-is"
      REPO_VER_FILE: "is/version"
      GHA_VER_NAME: "IS_IMG_VERSION"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check and Extract IS Version
        id: version_check
        env:
          VAR_VERSION: "${{ vars.IS_IMG_VERSION }}"
        run: |
          # Read the version modifier file (e.g., "1" or "1.0.0") and clean whitespace
          FILE_VERSION=$(cat ${{ env.REPO_VER_FILE }} | xargs)
          
          echo "Version sub-tag in repo file: $FILE_VERSION"
          echo "Version in GHA variables: $VAR_VERSION"
          
          if [ "$FILE_VERSION" = "$VAR_VERSION" ]; then
            echo "Versions match. Skipping WSO2 IS build."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "New version detected ($FILE_VERSION). Proceeding with build."
            echo "should_build=true" >> $GITHUB_OUTPUT
            # Store both the raw sub-version and the combined platform tag
            echo "new_version=$FILE_VERSION" >> $GITHUB_OUTPUT
            echo "full_tag=${{ env.REGISTRY_BASE }}:7.2.0-$FILE_VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR
        if: steps.version_check.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Strict uniqueness check: Explicitly fails if someone forgot to bump the sub-version file
      - name: Verify Tag Uniqueness in GHCR
        if: steps.version_check.outputs.should_build == 'true'
        run: |
          TARGET_IMAGE="${{ steps.version_check.outputs.full_tag }}"
          echo "Checking if $TARGET_IMAGE already exists..."
          
          if docker manifest inspect $TARGET_IMAGE > /dev/null 2>&1; then
            echo "::error::The WSO2 IS image tag 7.2.0-${{ steps.version_check.outputs.new_version }} already exists in GHCR! Please bump the version file."
            exit 1
          else
            echo "Tag is unique. Safe to proceed."
          fi

      - name: Build and push WSO2 IS image
        if: steps.version_check.outputs.should_build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./is
          push: true
          tags: |
            ${{ steps.version_check.outputs.full_tag }}
            ${{ env.REGISTRY_BASE }}:latest

      - name: Update GitHub Actions Variable
        if: steps.version_check.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/actions/variables/${{ env.GHA_VER_NAME }} \
            -f value="${{ steps.version_check.outputs.new_version }}"
