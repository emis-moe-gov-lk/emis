name: "Build & Deploy to dev"
run-name: "running dev ci/cd from ${{ github.ref_name }}"

on:
  push:
    branches: [dev]
    paths:
      - 'frontend/**'
      - 'backend/**'
  workflow_dispatch:
    inputs:
      services:
        description: "Services to deploy"
        type: choice
        options:
          - all
          - frontend
          - backend
        required: true
        default: "all"

permissions:
  contents: read
  packages: write

jobs:
  # ── Phase 1: Detect which services changed and bump versions ─────────────────
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend_changed: ${{ steps.set_flags.outputs.frontend_changed }}
      backend_changed: ${{ steps.set_flags.outputs.backend_changed }}
      any_changed: ${{ steps.set_flags.outputs.any_changed }}
      frontend_current_version: ${{ steps.fetch_vars.outputs.frontend_current }}
      backend_current_version: ${{ steps.fetch_vars.outputs.backend_current }}
      frontend_new_version: ${{ steps.bump_frontend.outputs.new_version }}
      backend_new_version: ${{ steps.bump_backend.outputs.new_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed service directories
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SVC="${{ inputs.services }}"
            echo "Manual dispatch — services: $SVC"
            case "$SVC" in
              *frontend*) echo "frontend_changed=true" >> $GITHUB_OUTPUT ;;
              *)         echo "frontend_changed=false" >> $GITHUB_OUTPUT ;;
            esac
            case "$SVC" in
              *backend*)  echo "backend_changed=true" >> $GITHUB_OUTPUT ;;
              *)          echo "backend_changed=false" >> $GITHUB_OUTPUT ;;
            esac
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
            if [ -z "$CHANGED" ]; then
              CHANGED=$(git diff --name-only HEAD~0 2>/dev/null || echo "")
            fi
            echo "Changed files:"
            echo "$CHANGED"

            if echo "$CHANGED" | grep -q "^frontend/"; then
              echo "frontend_changed=true" >> $GITHUB_OUTPUT
            else
              echo "frontend_changed=false" >> $GITHUB_OUTPUT
            fi
            if echo "$CHANGED" | grep -q "^backend/"; then
              echo "backend_changed=true" >> $GITHUB_OUTPUT
            else
              echo "backend_changed=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Generate GitHub App token
        id: app_token
        env:
          APP_ID: ${{ secrets.GH_APP_ID }}
          PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          INSTALLATION_ID: ${{ secrets.GH_APP_INSTALLATION_ID }}
        run: |
          printf '%s' "$PRIVATE_KEY" > /tmp/app-key.pem
          chmod 600 /tmp/app-key.pem

          NOW=$(date +%s)
          HEADER=$(printf '{"alg":"RS256","typ":"JWT"}' | base64 -w0 | tr -d '=' | tr '/+' '_-')
          PAYLOAD=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((NOW-60)) $((NOW+540)) "$APP_ID" \
            | base64 -w0 | tr -d '=' | tr '/+' '_-')
          SIG=$(printf '%s.%s' "$HEADER" "$PAYLOAD" \
            | openssl dgst -sha256 -sign /tmp/app-key.pem -binary \
            | base64 -w0 | tr -d '=' | tr '/+' '_-')
          JWT="${HEADER}.${PAYLOAD}.${SIG}"

          RESP=$(curl -s -X POST \
            -H "Authorization: Bearer ${JWT}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/app/installations/${INSTALLATION_ID}/access_tokens")
          TOKEN=$(echo "$RESP" | jq -r '.token')
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Fetch service versions from GitHub variables
        id: fetch_vars
        run: |
          VARS=$(curl -s -H "Authorization: Bearer ${{ steps.app_token.outputs.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/variables")

          FRONTEND=$(echo "$VARS" | jq -r '.variables[] | select(.name=="FRONTEND_VERSION") | .value')
          BACKEND=$(echo "$VARS" | jq -r '.variables[] | select(.name=="BACKEND_VERSION") | .value')

          echo "frontend_current=$FRONTEND" >> $GITHUB_OUTPUT
          echo "backend_current=$BACKEND" >> $GITHUB_OUTPUT

      - name: Set change flags
        id: set_flags
        run: |
          FE="${{ steps.detect.outputs.frontend_changed }}"
          BE="${{ steps.detect.outputs.backend_changed }}"
          echo "frontend_changed=$FE" >> $GITHUB_OUTPUT
          echo "backend_changed=$BE" >> $GITHUB_OUTPUT
          if [ "$FE" = "true" ] || [ "$BE" = "true" ]; then
            echo "any_changed=true" >> $GITHUB_OUTPUT
          else
            echo "any_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Bump frontend version
        id: bump_frontend
        run: |
          V="${{ steps.fetch_vars.outputs.frontend_current }}"
          if [ "${{ steps.detect.outputs.frontend_changed }}" = "true" ]; then
            BASE="${V%.*}"
            PATCH="${V##*.}"
            NEW="${BASE}.$((PATCH + 1))"
          else
            NEW="$V"
          fi
          echo "new_version=$NEW" >> $GITHUB_OUTPUT

      - name: Bump backend version
        id: bump_backend
        run: |
          V="${{ steps.fetch_vars.outputs.backend_current }}"
          if [ "${{ steps.detect.outputs.backend_changed }}" = "true" ]; then
            BASE="${V%.*}"
            PATCH="${V##*.}"
            NEW="${BASE}.$((PATCH + 1))"
          else
            NEW="$V"
          fi
          echo "new_version=$NEW" >> $GITHUB_OUTPUT

  # ── Phase 2: Build & push Docker images (parallel, conditional) ──────────────
  build-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend_changed == 'true'
    uses: ./.github/workflows/build-push-frontend.yml
    with:
      version: ${{ needs.detect-changes.outputs.frontend_new_version }}
    secrets: inherit

  build-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend_changed == 'true'
    uses: ./.github/workflows/build-push-backend.yml
    with:
      version: ${{ needs.detect-changes.outputs.backend_new_version }}
    secrets: inherit

  # ── Phase 3: Finalize — update GH variables and commit version files ─────────
  finalize:
    needs: [detect-changes, build-frontend, build-backend]
    if: |
      always() &&
      needs.detect-changes.result == 'success' &&
      (
        (needs.build-frontend.result == 'success' && needs.build-frontend.outputs.image_built == 'true') ||
        (needs.build-backend.result == 'success' && needs.build-backend.outputs.image_built == 'true')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate GitHub App token
        id: app_token
        env:
          APP_ID: ${{ secrets.GH_APP_ID }}
          PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          INSTALLATION_ID: ${{ secrets.GH_APP_INSTALLATION_ID }}
        run: |
          printf '%s' "$PRIVATE_KEY" > /tmp/app-key.pem
          chmod 600 /tmp/app-key.pem
          NOW=$(date +%s)
          HEADER=$(printf '{"alg":"RS256","typ":"JWT"}' | base64 -w0 | tr -d '=' | tr '/+' '_-')
          PAYLOAD=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((NOW-60)) $((NOW+540)) "$APP_ID" \
            | base64 -w0 | tr -d '=' | tr '/+' '_-')
          SIG=$(printf '%s.%s' "$HEADER" "$PAYLOAD" \
            | openssl dgst -sha256 -sign /tmp/app-key.pem -binary \
            | base64 -w0 | tr -d '=' | tr '/+' '_-')
          JWT="${HEADER}.${PAYLOAD}.${SIG}"
          RESP=$(curl -s -X POST \
            -H "Authorization: Bearer ${JWT}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/app/installations/${INSTALLATION_ID}/access_tokens")
          TOKEN=$(echo "$RESP" | jq -r '.token')
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Finalize frontend
        if: needs.build-frontend.result == 'success' && needs.build-frontend.outputs.image_built == 'true'
        run: |
          V="${{ needs.detect-changes.outputs.frontend_new_version }}"
          echo "$V" > frontend/version
          curl -s -X PATCH \
            -H "Authorization: Bearer ${{ steps.app_token.outputs.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/variables/FRONTEND_VERSION" \
            -d "{\"name\":\"FRONTEND_VERSION\",\"value\":\"$V\"}"

      - name: Finalize backend
        if: needs.build-backend.result == 'success' && needs.build-backend.outputs.image_built == 'true'
        run: |
          V="${{ needs.detect-changes.outputs.backend_new_version }}"
          echo "$V" > backend/version
          curl -s -X PATCH \
            -H "Authorization: Bearer ${{ steps.app_token.outputs.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/variables/BACKEND_VERSION" \
            -d "{\"name\":\"BACKEND_VERSION\",\"value\":\"$V\"}"

      - name: Commit version file changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet --exit-code; then
            git add frontend/version backend/version
            git commit -m "chore: bump service versions [skip ci]"
            git push
          fi

  # ── Phase 4: Deploy to Swarm ─────────────────────────────────────────────────
  deploy:
    needs: [detect-changes, build-frontend, build-backend]
    if: |
      always() &&
      needs.detect-changes.result == 'success' &&
      (
        (needs.build-frontend.result == 'success' && needs.build-frontend.outputs.image_built == 'true') ||
        (needs.build-backend.result == 'success' && needs.build-backend.outputs.image_built == 'true')
      )
    runs-on: ubuntu-latest
    env:
      FRONTEND_VER: ${{ needs.detect-changes.outputs.frontend_new_version }}
      BACKEND_VER: ${{ needs.detect-changes.outputs.backend_new_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ansible
        run: pip install ansible

      - name: Write env.yml and inventory.yml
        run: |
          mkdir -p infrastructure/ansible/deploy-setup/env
          cat > infrastructure/ansible/deploy-setup/env/env.yml << 'ENVEOF'
          ${{ secrets.ENV_YML }}
          ENVEOF
          mkdir -p infrastructure/ansible/deploy-setup/inventory
          cat > infrastructure/ansible/deploy-setup/inventory/inventory.yml << 'INVEOF'
          ${{ secrets.INVENTORY_YML }}
          INVEOF

      - name: Fix unquoted Jinja2 templates in YAML
        run: |
          python3 -c '
          import re, sys
          for fpath in sys.argv[1:]:
              with open(fpath) as f:
                  lines = f.readlines()
              with open(fpath, "w") as f:
                  for line in lines:
                      for pat in [r"^(\s*[\w-]+\s*:\s+)(.+)$", r"^(\s*-\s+)(.+)$"]:
                          m = re.match(pat, line)
                          if m and "{{" in m.group(2):
                              val = m.group(2).rstrip()
                              if not (val.startswith("\"") and val.endswith("\"")):
                                  line = m.group(1) + "\"" + val + "\"\n"
                              break
                      f.write(line)
          ' \
            infrastructure/ansible/deploy-setup/env/env.yml \
            infrastructure/ansible/deploy-setup/inventory/inventory.yml

      - name: Patch image tags in env.yml
        run: |
          sed -i "s/^frontend_image_tag:.*/frontend_image_tag: \"${FRONTEND_VER}\"/" \
            infrastructure/ansible/deploy-setup/env/env.yml
          sed -i "s/^backend_image_tag:.*/backend_image_tag: \"${BACKEND_VER}\"/" \
            infrastructure/ansible/deploy-setup/env/env.yml

      - name: Write SSH key and config
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config << 'EOF'
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            IdentitiesOnly yes
            IdentityFile ~/.ssh/deploy_key
          EOF
          chmod 600 ~/.ssh/config

      - name: Run deploy-stack-rotate playbook
        working-directory: infrastructure/ansible/deploy-setup
        run: |
          ansible-playbook \
            -i inventory/inventory.yml \
            -e @env/env.yml \
            -e deploy_env=env \
            playbooks/deploy-stack-rotate.yml
