worker_processes auto;
events { worker_connections 1024; }

http {
    # Logging
    log_format proxy '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" host="$host" upstream="$upstream_addr"';
    access_log /var/log/nginx/access.log proxy;
    error_log  /var/log/nginx/error.log warn;

    # Required for the WSO2 carbon console + portals (cookies + redirect URLs)
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # WSO2 upstreams use self-signed certs; don't verify
    proxy_ssl_verify       off;
    proxy_ssl_server_name  on;

    # Larger buffer for WSO2 carbon console responses
    proxy_buffer_size      16k;
    proxy_buffers          8 16k;
    client_max_body_size   50m;

    # ── HTTP → HTTPS redirect for all known hosts ──────────────────────────
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── Frontend (React app) ───────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name app-uat.emis.moe.gov.lk;
        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        location / {
            proxy_pass http://frontend:80;
        }
    }

    # ── Backend (Laravel via FrankenPHP) ───────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name api-uat.emis.moe.gov.lk;
        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        location / {
            proxy_pass http://backend:80;
        }
    }

    # ── WSO2 Identity Server (carbon + console + my-account) ───────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name idp.app-uat.emis.moe.gov.lk;
        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        location / {
            # WSO2 IS uses port offset 1 → listens on 9444 inside the container.
            proxy_pass https://wso2-is:9444;
        }
    }

    # ── WSO2 APIM (carbon + publisher + devportal) ─────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name apim.app-uat.emis.moe.gov.lk;
        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        location / {
            proxy_pass https://wso2-apim:9443;
        }
    }

    # ── WSO2 APIM gateway (API traffic) ────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name services.app-uat.emis.moe.gov.lk;
        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        location / {
            proxy_pass https://wso2-apim:8243;
        }
    }
}
