# Local-dev override for docker-stack.yml.
# Usage: docker compose -f docker-stack.yml -f docker-compose.local.yml up
#
# This file:
#   - Switches the overlay network to bridge (compose can't create overlays)
#   - Adds top-level restart keys (compose ignores deploy.restart_policy)
#   - Adds a local mysql service and points backend at it
#   - Adds build: directives so images are built from local Dockerfiles
#     instead of pulled from a registry

networks:
  uat-emis-swm-network:
    driver: bridge

volumes:
  mysql-data:

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: emis
      MYSQL_USER: emis
      MYSQL_PASSWORD: emis
    ports:
      - "3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - uat-emis-swm-network
    restart: on-failure
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  wso2-is:
    build:
      context: ../../is
    restart: on-failure
    environment:
      IS_DB_HOST: mysql
      IS_DB_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy

  wso2-apim:
    build:
      context: ../../apim
    restart: on-failure
    environment:
      APIM_DB_HOST: mysql
      APIM_DB_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ../../frontend
      # Vite bakes VITE_* into the JS bundle at build time. These build-args
      # are sourced from frontend.env via compose's variable interpolation —
      # callers must run `set -a; source frontend.env; set +a` before
      # `docker compose ... build frontend` so the values are in the
      # environment. scripts/configure-auth.sh and scripts/rebuild.sh do this.
      args:
        VITE_ASGARDEO_BASE_URL: ${VITE_ASGARDEO_BASE_URL:-}
        VITE_ASGARDEO_CLIENT_ID: ${VITE_ASGARDEO_CLIENT_ID:-}
        VITE_SIGNIN_REDIRECT_URL: ${VITE_SIGNIN_REDIRECT_URL:-}
        VITE_SIGNOUT_REDIRECT_URL: ${VITE_SIGNOUT_REDIRECT_URL:-}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_MESSAGE_SERVICE_URL: ${VITE_MESSAGE_SERVICE_URL:-http://localhost:3001}
    restart: on-failure
    # Frontend is fronted by nginx-proxy; remove its host port mapping to
    # free up host port 80 for the proxy. (!override replaces the base
    # file's "80:80" instead of appending.)
    ports: !override []

  message-service:
    build:
      context: ../../Message-service
    restart: on-failure
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: emis
      DB_USER: root
      DB_PASSWORD: root
      LARAVEL_BASE_URL: http://backend
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    build:
      context: ../../backend
    restart: on-failure
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: emis
      DB_USERNAME: emis
      DB_PASSWORD: emis
      # FrankenPHP/Caddy listen address — bare ":80" disables auto-HTTPS for local
      SERVER_NAME: ":80"
    depends_on:
      mysql:
        condition: service_healthy

  # ── Reverse proxy: routes by hostname to all five services ──────────────
  # Hostnames mirror UAT — add /etc/hosts entries pointing them at 127.0.0.1.
  nginx-proxy:
    image: nginx:1.27-alpine
    restart: on-failure
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-proxy/certs:/etc/nginx/certs:ro
    networks:
      # Sibling containers (wso2-apim, wso2-is, backend) need to resolve the
      # UAT-mirror hostnames to the proxy too — e.g. so APIM can hit
      # https://idp.app-uat.emis.moe.gov.lk/oauth2/token from inside its
      # container with an issuer that matches IS's configured hostname.
      uat-emis-swm-network:
        aliases:
          - app-uat.emis.moe.gov.lk
          - api-uat.emis.moe.gov.lk
          - idp.app-uat.emis.moe.gov.lk
          - apim.app-uat.emis.moe.gov.lk
          - services.app-uat.emis.moe.gov.lk
    depends_on:
      - frontend
      - backend
      - wso2-is
      - wso2-apim
