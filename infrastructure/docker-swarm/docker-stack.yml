# ── VOLUMES ────────────────────────────────────────────────────────────────────
volumes:
  mysql_data:

# ── NETWORKS ──────────────────────────────────────────────────────────────────
networks:
  emis-network:
    driver: overlay
    name: "${STACK_NAME}-network"
    attachable: true
    ipam:
      driver: default
      config:
        - subnet: "${STACK_NETWORK_SUBNET}"

# ── SERVICES ──────────────────────────────────────────────────────────────────
services:

  # ── MySQL ───────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - emis-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # ── WSO2 Identity Server ───────────────────────────────────────────────────
  wso2-is:
    image: "${WSO2_IS_DOCKERIMG_REPO}:${WSO2_IS_DOCKERIMG_TAG}"
    ports:
      - "${IS_HOST_PORT}:9444"
    env_file:
      - is.env
    networks:
      - emis-network
    depends_on:
      - mysql
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3

  # ── WSO2 API Manager ──────────────────────────────────────────────────────
  wso2-apim:
    image: "${WSO2_APIM_DOCKERIMG_REPO}:${WSO2_APIM_DOCKERIMG_TAG}"
    ports:
      - "${APIM_HOST_PORT}:9443"
      - "${APIM_GATEWAY_PORT}:8243"
      - "${APIM_GATEWAY_HTTP_PORT}:8280"
    env_file:
      - apim.env
    networks:
      - emis-network
    depends_on:
      - mysql
      - wso2-is
    healthcheck:
      test: ["CMD-SHELL", "curl -kf https://localhost:9443/api/health-check/v1.0/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    image: "${FRONTEND_DOCKERIMG_REPO}:${FRONTEND_DOCKERIMG_TAG}"
    ports:
      - "${FRONTEND_HOST_PORT}:80"
    env_file:
      - frontend.env
    networks:
      - emis-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    image: "${BACKEND_DOCKERIMG_REPO}:${BACKEND_DOCKERIMG_TAG}"
    ports:
      - "${BACKEND_HOST_PORT}:80"
    env_file:
      - backend.env
    command: >
      sh -c "
      composer install --no-interaction &&
      cp .env.example .env &&
      php artisan key:generate --force &&
      php artisan migrate:fresh --force &&
      php artisan wso2:cache-roles &&
      php -d memory_limit=2G artisan db:seed --force &&
      frankenphp run --config /etc/caddy/Caddyfile
      "
    networks:
      - emis-network
    depends_on:
      - mysql
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:2019/metrics || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 480s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
