# ── VOLUMES ────────────────────────────────────────────────────────────────────
volumes:
  mysql_data:

# ── NETWORKS ──────────────────────────────────────────────────────────────────
networks:
  emis-network:
    driver: overlay
    name: "${STACK_NAME}-network"
    attachable: true
    ipam:
      driver: default
      config:
        - subnet: "${STACK_NETWORK_SUBNET}"

# ── SERVICES ──────────────────────────────────────────────────────────────────
services:

  # ── MySQL ───────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - emis-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # ── WSO2 Identity Server ───────────────────────────────────────────────────
  wso2-is:
    image: "${WSO2_IS_DOCKERIMG_REPO}:${WSO2_IS_DOCKERIMG_TAG}"
    ports:
      - "${IS_HOST_PORT}:9444"
    env_file:
      - is.env
    networks:
      - emis-network
    depends_on:
      - mysql
    entrypoint: ["/bin/bash", "-c"]
    command: |
      echo 'Waiting for MySQL...' &&
      until echo > /dev/tcp/mysql/3306 2>/dev/null; do sleep 5; done &&
      echo 'MySQL is ready, starting WSO2 IS...' &&
      exec /home/wso2carbon/wso2is-7.2.0/bin/wso2server.sh
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
