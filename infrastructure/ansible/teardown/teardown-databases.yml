---
# ---TEARDOWN-DATABASES-----
# Drops all WSO2 and EMIS databases, removes known MySQL application users.
# Uses Unix socket auth — no root password required.
- name: Tear down EMIS and WSO2 MySQL databases
  hosts: db_host
  become: true
  gather_facts: false
  collections:
    - community.mysql
  vars:
    mysql_socket: /var/run/mysqld/mysqld.sock

  tasks:
    # ── Check MySQL is reachable ──────────────────────────────────────────────

    - name: Check MySQL is running via socket
      ansible.builtin.command: mysql --socket={{ mysql_socket }} -e "SELECT 1"
      register: mysql_check
      changed_when: false
      ignore_errors: true

    - name: Abort gracefully if MySQL is not reachable
      ansible.builtin.debug:
        msg: "MySQL is not running or socket not found — skipping database teardown."
      when: mysql_check.rc != 0

    # ── Set databases and users to clean up ───────────────────────────────────

    - name: Set databases and users to clean up
      ansible.builtin.set_fact:
        databases_to_drop: "{{ [mysql_emis_db | default(''), mysql_is_db | default(''), mysql_wso2_shared_db | default('')] | reject('equalto', '') | list }}"
        users_to_remove: "{{ [mysql_emis_user | default(''), mysql_wso2_user | default('')] | reject('equalto', '') | list }}"
      when: mysql_check.rc == 0

    - name: Show databases to drop
      ansible.builtin.debug:
        msg: "Databases to drop: {{ databases_to_drop | default([]) }}"
      when:
        - mysql_check.rc == 0
        - databases_to_drop | length > 0

    # ── Drop discovered databases ─────────────────────────────────────────────

    - name: Drop EMIS and WSO2 databases
      community.mysql.mysql_db:
        name: "{{ item }}"
        state: absent
        login_unix_socket: "{{ mysql_socket }}"
      loop: "{{ databases_to_drop | default([]) }}"
      when:
        - mysql_check.rc == 0
        - databases_to_drop | length > 0

    # ── Remove known MySQL users ──────────────────────────────────────────────

    - name: Remove EMIS and WSO2 MySQL users
      community.mysql.mysql_user:
        name: "{{ item }}"
        host_all: true
        state: absent
        login_unix_socket: "{{ mysql_socket }}"
      loop: "{{ users_to_remove | default([]) }}"
      when:
        - mysql_check.rc == 0
        - users_to_remove | length > 0
      ignore_errors: true

    # ── Flush privileges ──────────────────────────────────────────────────────

    - name: Flush MySQL privileges
      community.mysql.mysql_query:
        login_unix_socket: "{{ mysql_socket }}"
        query: "FLUSH PRIVILEGES"
      when: mysql_check.rc == 0

    - name: Database teardown complete
      ansible.builtin.debug:
        msg: "Dropped: {{ databases_to_drop | default([]) }}. Users removed: {{ users_to_remove | default([]) }}."
      when: mysql_check.rc == 0
