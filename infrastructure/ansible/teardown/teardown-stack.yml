---
# ---TEARDOWN-STACK-----
# Discovers and removes all emis-* Docker stacks, cleans deploy dirs and temp files.
# Docker Engine itself is left untouched.
- name: Tear down EMIS Docker stacks and deployed files
  hosts: swarm_managers
  become: true
  gather_facts: false

  tasks:
    # ── Set stacks to remove ──────────────────────────────────────────────────

    - name: Set stacks to remove
      ansible.builtin.set_fact:
        stacks_to_remove: "{{ [stack_name] if (stack_name is defined and stack_name) else [] }}"

    # ── Remove each stack ─────────────────────────────────────────────────────

    - name: Remove each EMIS stack
      ansible.builtin.command: docker stack rm {{ item }}
      loop: "{{ stacks_to_remove }}"
      when: stacks_to_remove | length > 0
      ignore_errors: true

    # ── Wait for full drain ───────────────────────────────────────────────────

    - name: Wait for stack tasks to drain
      ansible.builtin.shell: |
        docker stack ps {{ item }} --format '{{ '{{' }}.CurrentState{{ '}}' }}' | grep -v Shutdown | grep -c .
      register: drain_check
      until: drain_check.rc != 0
      retries: 30
      delay: 5
      loop: "{{ stacks_to_remove }}"
      when: stacks_to_remove | length > 0
      changed_when: false
      failed_when: false

    # ── Remove known deploy paths ─────────────────────────────────────────────

    - name: Set deploy directories to remove
      ansible.builtin.set_fact:
        deploy_dirs_to_remove: "{{ [stack_deploy_path] if (stack_deploy_path is defined and stack_deploy_path) else [] }}"

    - name: Remove EMIS deploy directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ deploy_dirs_to_remove }}"
      when: deploy_dirs_to_remove | length > 0
      ignore_errors: true

    # ── Remove temp SQL import dirs ───────────────────────────────────────────

    - name: Remove temporary SQL import directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/sql_imports
        - /tmp/sql_imports_noapim
      ignore_errors: true

    - name: Stack teardown complete
      ansible.builtin.debug:
        msg: "Stacks removed: {{ stacks_to_remove }}. Deploy dirs cleaned: {{ deploy_dirs_to_remove }}."
