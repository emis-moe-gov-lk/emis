---
# ============================================================
# EMIS — Master Teardown Orchestration
# ============================================================
# Removes ALL EMIS services, databases, and MySQL from the target hosts.
# Docker Engine is left untouched.
#
# Works for both deploy-proto and deploy-noapim — no env file needed.
# Only the inventory is required at runtime.
#
# Usage:
#   ansible-playbook teardown/site-teardown.yml \
#     -i deploy-noapim/inventory/uat.yml
#
#   ansible-playbook teardown/site-teardown.yml \
#     -i deploy-proto/inventory/uat.yml
# ============================================================

# ── Safety confirmation ───────────────────────────────────────────────────────
- name: Confirm teardown intent
  hosts: localhost
  gather_facts: false
  vars_prompt:
    - name: confirm
      prompt: |
        ================================================================
        WARNING: This will permanently destroy only the resources defined in your variables:
          - Docker stack: {{ stack_name | default('UNDEFINED - WILL BE SKIPPED') }}
          - Deployed files under: {{ stack_deploy_path | default('UNDEFINED - WILL BE SKIPPED') }}
          - MySQL databases: {{ [mysql_emis_db, mysql_is_db, mysql_is_shared_db] | select('defined') | list | join(' ') | default('UNDEFINED - WILL BE SKIPPED') }}
          - MySQL users: {{ [mysql_emis_user, mysql_wso2_user] | select('defined') | list | join(' ') | default('UNDEFINED - WILL BE SKIPPED') }}
          {% if purge_mysql | default(false) | bool %}
          - MySQL itself (packages, data, config, logs)
          {% endif %}

        Docker Engine will NOT be touched.

        Type  yes  to continue, anything else to abort
        ================================================================
      private: false

  tasks:
    - name: Abort if not confirmed
      ansible.builtin.assert:
        that: confirm == "yes"
        fail_msg: "Teardown aborted."
        success_msg: "Confirmed. Proceeding with teardown."

# ── Pre-flight checks ────────────────────────────────────────────────────────
- name: Pre-flight checks
  hosts: swarm_managers,db_host
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Verify host reachability
      ansible.builtin.ping:

    - name: Verify sudo access
      ansible.builtin.command: whoami
      register: become_check
      changed_when: false
      failed_when: become_check.stdout != 'root'

# ── Step 1: Remove Docker stacks and deployed files ───────────────────────────
- import_playbook: teardown-stack.yml

# ── Step 2: Drop databases and remove MySQL users ─────────────────────────────
- import_playbook: teardown-databases.yml

# ── Step 3: Purge MySQL from host ─────────────────────────────────────────────
- import_playbook: teardown-mysql.yml
  when: purge_mysql | default(false) | bool

# ── Final summary ─────────────────────────────────────────────────────────────
- name: Teardown complete
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Summary
      ansible.builtin.debug:
        msg: |
          ================================================================
          EMIS teardown complete.
            - Docker stack: {{ stack_name | default('SKIPPED') }}
            - Deploy dir: {{ stack_deploy_path | default('SKIPPED') }}
            - Databases dropped: {{ [mysql_emis_db, mysql_is_db, mysql_is_shared_db] | select('defined') | list | join(' ') | default('NONE') }}
            - MySQL users removed: {{ [mysql_emis_user, mysql_wso2_user] | select('defined') | list | join(' ') | default('NONE') }}
            {% if purge_mysql | default(false) | bool %}
            - MySQL purged from host
            {% endif %}
            - Docker Engine untouched
          ================================================================
