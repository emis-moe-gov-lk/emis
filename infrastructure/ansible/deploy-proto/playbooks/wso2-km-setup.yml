---
- name: Configure WSO2 Identity Server as Key Manager in APIM
  hosts: all
  gather_facts: false
  vars:
    # Target host IPs/DNS (using localhost if running locally against exposed ports)
    target_host: "192.168.200.2" 
    apim_host: "apim.app-uat.emis.moe.gov.lk"
    is_host: "idp.app-uat.emis.moe.gov.lk"

    # Exposed ports on the host
    apim_port: "9443"
    is_port: "9444"
    
    # WSO2 APIM Credentials (to authenticate with Admin API)
    apim_admin_user: "admin"
    apim_admin_pass: "ADMIN00"
    
    # WSO2 IS Credentials (to register inside the Key Manager config)
    is_admin_user: "admin"
    is_admin_pass: "ADMIN11"
    
    # The endpoint APIM will use to reach IS. 
    # If APIM is inside docker, 127.0.0.1 won't work for the wellKnownEndpoint.
    # Change this to the host machine's actual LAN IP, or the IS container's docker-network name.
    is_internal_address: "wso2-is" 

  tasks:

    - name: Ensure EMIS UAT domain mappings exist in /etc/hosts
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} ANSIBLE MANAGED BLOCK - EMIS UAT HOSTS"
        block: |
          124.43.177.235 services.app-uat.emis.moe.gov.lk
          124.43.177.235 idp.app-uat.emis.moe.gov.lk
          124.43.177.235 apim.app-uat.emis.moe.gov.lk
      become: true

    - name: Wait for WSO2 APIM Admin API to fully boot and serve HTTP (can take 3-5 mins)
      ansible.builtin.uri:
        url: "https://{{ apim_host }}/carbon/"
        method: GET
        validate_certs: false
        # Accept OK or Redirects (WSO2 usually redirects to the login page)
        status_code: [200, 301, 302] 
      register: apim_health
      until: apim_health.status in [200, 301, 302]
      retries: 40   # Try 40 times
      delay: 15     # Wait 15 seconds between tries (Total 10 minutes max)

    - name: Wait for WSO2 IS to fully boot and serve HTTP
      ansible.builtin.uri:
        url: "https://{{ is_host }}/carbon/"
        method: GET
        validate_certs: false
        status_code: [200, 301, 302]
      register: is_health
      until: is_health.status in [200, 301, 302]
      retries: 40
      delay: 15

    - name: Ensure APIM Management port ({{ apim_port }}) is open and responding
      ansible.builtin.wait_for:
        host: "{{ target_host }}"
        port: "{{ apim_port }}"
        state: started
        timeout: 300
        msg: "Timeout waiting for WSO2 APIM to become available."

    - name: Ensure IS port ({{ is_port }}) is open and responding
      ansible.builtin.wait_for:
        host: "{{ target_host }}"
        port: "{{ is_port }}"
        state: started
        timeout: 300
        msg: "Timeout waiting for WSO2 IS to become available."

    - name: Fetch Public Certificate from WSO2 IS
      ansible.builtin.shell: |
        echo -n | openssl s_client -connect {{ is_host }}:443 -showcerts 2>/dev/null | openssl x509 -outform PEM
      register: is_cert
      changed_when: false
      failed_when: "'BEGIN CERTIFICATE' not in is_cert.stdout"

    - name: Register DCR Client in WSO2 APIM
      ansible.builtin.uri:
        url: "https://{{ apim_host }}/api/identity/oauth2/dcr/v1.1/register"
        method: POST
        user: "{{ apim_admin_user }}"
        password: "{{ apim_admin_pass }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          client_name: "ansible_cert_automation_{{ 99999999 | random }}"
          grant_types: 
            - "password"
            - "client_credentials"
        status_code: [200, 201]
      register: dcr_response


    - block:
        - name: Generate OAuth2 Access Token for Admin Scope
          ansible.builtin.uri:
            url: "https://{{ apim_host }}/oauth2/token"
            method: POST
            user: "{{ dcr_response.json.client_id }}"
            password: "{{ dcr_response.json.client_secret }}"
            force_basic_auth: true
            validate_certs: false
            body_format: form-urlencoded
            body:
              grant_type: "client_credentials"
              scope: "apim:admin"
            status_code: 200
          register: token_response


        - name: Register WSO2 IS as External Key Manager
          ansible.builtin.uri:
            url: "https://{{ apim_host }}/api/am/admin/v4/key-managers"
            method: POST
            headers:
              Authorization: "Bearer {{ token_response.json.access_token }}"
            validate_certs: false
            body_format: json
            body:
              name: "WSO2-IS-KM"
              displayName: "WSO2 Identity Server"
              # Updated to target the IS 7.x engine structure explicitly
              type: "WSO2-IS-7" 
              description: "Configured via Ansible"
              wellKnownEndpoint: "https://{{ is_internal_address }}/oauth2/token/.well-known/openid-configuration"
              certificates:
                type: "PEM"
                value: "{{ is_cert.stdout }}"
              additionalProperties:
                Username: "{{ is_admin_user }}"
                Password: "{{ is_admin_pass }}"
              enabled: true
            status_code: [200, 201]
          register: km_response
          failed_when: 
            - km_response.status not in [200, 201, 409]

        - name: Report Status
          ansible.builtin.debug:
            msg: 
              - "Key Manager successfully created!"
              - "Response: {{ km_response.status }}"
          when: km_response.status in [200, 201]


      always:
        - name: Clean up the temporary DCR application
          ansible.builtin.uri:
            url: "https://apim.app-uat.emis.moe.gov.lk/api/identity/oauth2/dcr/v1.1/register/{{ dcr_response.json.client_id }}"
            method: DELETE
            user: "{{ apim_admin_user }}"
            password: "{{ apim_admin_pass }}"
            force_basic_auth: true
            validate_certs: false
            status_code: [200, 204]
          # Only run this if the DCR registration actually succeeded in the first place
          when: dcr_response is defined and dcr_response.json is defined
