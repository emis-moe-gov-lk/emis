---
# ============================================================
# EMIS Deployment Environment — UAT
# ============================================================
# Generated from schema.yml.example. Credentials marked [VAULT]
# should be encrypted before committing to any shared store:
#   ansible-vault encrypt_string 'value' --name 'key'
# ============================================================

# ── Stack identity ───────────────────────────────────────────
stack_name: emis-uat-texas
deploy_env: uat
stack_deploy_path: /opt/emis

# ── Docker image tags ────────────────────────────────────────
frontend_image_repo: ghcr.io/emis-moe-gov-lk/emis-frontend
frontend_image_tag:  "0.1"
backend_image_repo:  ghcr.io/emis-moe-gov-lk/emis-backend
backend_image_tag:   "0.4.3"
is_image_repo:       ghcr.io/emis-moe-gov-lk/emis-is
is_image_tag:        7.2.0-0.4.2
apim_image_repo:     ghcr.io/emis-moe-gov-lk/emis-apim
apim_image_tag:      4.6.0-solo-0.5.1

# ── Docker registry auth ─────────────────────────────────────
registry_host:     ghcr.io
registry_username: emis-moe-gov-lk             # [REQUIRED] GitHub username / PAT owner
registry_password: changeme                    # [REQUIRED] [VAULT] GitHub PAT with read:packages

# ── MySQL — EMIS database ────────────────────────────────────
mysql_root_password: root                      # [VAULT] in real deploys
mysql_emis_db:       emis-uat
mysql_emis_user:     emis-user
mysql_emis_password: EmisUser0                 # [VAULT]
mysql_bind_address:  127.0.0.1

# ── MySQL — WSO2 databases ───────────────────────────────────
mysql_wso2_user:          wso2-user
mysql_wso2_password:      "WSO2@User4"         # [VAULT]
mysql_apim_db:            wso2_apim_db
mysql_apim_shared_db:     wso2_apim_shared_db
mysql_is_db:              wso2_is_db
mysql_is_shared_db:       wso2_is_shared_db

# ── WSO2 IS ──────────────────────────────────────────────────
is_hostname:          idp.app-uat.emis.moe.gov.lk
is_proxy_host:        idp.app-uat.emis.moe.gov.lk
is_proxy_port:        "443"
is_admin_user:        admin
is_admin_password:    ADMIN11                  # [VAULT]
is_db_host:           "{{ hostvars[groups['db_host'][0]].ansible_host }}"
is_db_port:           "3306"

# ── WSO2 APIM ────────────────────────────────────────────────
apim_hostname:        apim.app-uat.emis.moe.gov.lk
apim_proxy_host:      apim.app-uat.emis.moe.gov.lk
apim_proxy_port:      "443"
apim_admin_user:      admin
apim_admin_password:  ADMIN00                  # [VAULT]
apim_db_host:         "{{ hostvars[groups['db_host'][0]].ansible_host }}"
apim_db_port:         "3306"
apim_gateway_url:     services.app-uat.emis.moe.gov.lk

# ── Backend (Laravel) ────────────────────────────────────────
app_name:    EMIS
app_env:     production
app_key:     base64:MO/xhx7kxXI/6zErGCUHSQctAORLnFlUEZZXPKQlrYQ=  # [VAULT]
app_debug:   "false"
app_url:     https://api-uat.emis.moe.gov.lk

db_host:     "{{ hostvars[groups['db_host'][0]].ansible_host }}"
db_port:     "3306"
db_database: "{{ mysql_emis_db }}"
db_username: "{{ mysql_emis_user }}"
db_password: "{{ mysql_emis_password }}"

wso2_enabled:    "True"
wso2_base_url:   "https://{{ is_hostname }}"
wso2_verify_ssl: "False"
# Populated after configure-emis-app.yml runs — paste output here, then re-run 05:
wso2_m2m_client_id:     ""
wso2_m2m_client_secret: ""                    # [VAULT] once known
wso2_teacher_role_id:   ""

# ASGARDEO_* vars in backend.env are derived from is_hostname and wso2_m2m_client_id/secret above.
# No extra variables needed here.

memcached_host: memcached

# ── Frontend (Vite — baked at image build time) ──────────────
vite_asgardeo_base_url:  "https://{{ is_hostname }}"
vite_asgardeo_client_id: ""                   # set after configure-emis-app.yml — consumer key of "EMIS Web App"
vite_signin_redirect_url:  https://app-uat.emis.moe.gov.lk/authentication/callback
vite_signout_redirect_url: https://app-uat.emis.moe.gov.lk/logout
vite_api_base_url:         https://services.app-uat.emis.moe.gov.lk/hrm/1.0.0

# ── IS / APIM key manager registration ──────────────────────
km_name:           emis-uat
km_description:    "EMIS UAT IS 7 Key Manager"

# ── EMIS application resources (used by configure-emis-app) ─
nemis_roles:
  - Teacher
  - Principal
  - DataEntry

nemis_users:
  - username:    teacher1
    password:    Teacher@123
    first_name:  Teacher
    last_name:   One
    email:       teacher1@emis.moe.gov.lk
    roles:       [Teacher]
  - username:    principal1
    password:    Principal@123
    first_name:  Principal
    last_name:   One
    email:       principal1@emis.moe.gov.lk
    roles:       [Principal]
  - username:    dataentry1
    password:    DataEntry@123
    first_name:  DataEntry
    last_name:   One
    email:       dataentry1@emis.moe.gov.lk
    roles:       [DataEntry]

nemis_apis:
  - name:        EMIS-HRM
    version:     v1.0.0
    context:     /hrm
    backend_url: "https://api-uat.emis.moe.gov.lk/api/"
    openapi_url: "https://api-uat.emis.moe.gov.lk/api/openapi.json"

nemis_apps:
  - name:          "EMIS Web App"
    grant_types:   [authorization_code, refresh_token]
    callback_url:  "https://app-uat.emis.moe.gov.lk/authentication/callback"
    public_client: true
  - name:          "CEMIS-LK M2M"
    grant_types:   [client_credentials]
    callback_url:  ""
    public_client: false
