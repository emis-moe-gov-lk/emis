---
# ============================================================
# EMIS Deployment Environment — Production
# ============================================================
# All [VAULT] values MUST be encrypted before use:
#   ansible-vault encrypt_string 'value' --name 'key'
# Run the full deploy:
#   ansible-playbook site.yml -i inventory/prod.yml -e @env/prod.yml \
#     --vault-password-file <(echo "$VAULT_PASS")
# ============================================================

# ── Stack identity ───────────────────────────────────────────
stack_name: emis-prod
deploy_env: prod
stack_deploy_path: /opt/emis

# ── Docker image tags ────────────────────────────────────────
frontend_image_repo: ghcr.io/emis-moe-gov-lk/emis-frontend    # [REQUIRED]
frontend_image_tag:  ""                                         # [REQUIRED] — pin to a release tag
backend_image_repo:  ghcr.io/emis-moe-gov-lk/emis-backend      # [REQUIRED]
backend_image_tag:   ""                                         # [REQUIRED]
is_image_repo:       ghcr.io/emis-moe-gov-lk/emis-is           # [REQUIRED]
is_image_tag:        ""                                         # [REQUIRED]
apim_image_repo:     ghcr.io/emis-moe-gov-lk/emis-apim         # [REQUIRED]
apim_image_tag:      ""                                         # [REQUIRED]

# ── Docker registry auth ─────────────────────────────────────
registry_host:     ghcr.io
registry_username: emis-moe-gov-lk             # [REQUIRED] GitHub username / PAT owner
registry_password: changeme                    # [REQUIRED] [VAULT] GitHub PAT with read:packages

# ── MySQL — EMIS database ────────────────────────────────────
mysql_root_password: changeme                  # [REQUIRED] [VAULT]
mysql_emis_db:       emis-prod
mysql_emis_user:     emis-prod-user
mysql_emis_password: changeme                  # [REQUIRED] [VAULT]
mysql_bind_address:  127.0.0.1

# ── MySQL — WSO2 databases ───────────────────────────────────
mysql_wso2_user:          wso2-prod-user
mysql_wso2_password:      changeme             # [REQUIRED] [VAULT]
mysql_apim_db:            wso2_apim_db
mysql_apim_shared_db:     wso2_apim_shared_db
mysql_is_db:              wso2_is_db
mysql_is_shared_db:       wso2_is_shared_db

# ── WSO2 IS ──────────────────────────────────────────────────
is_hostname:          idp.app.emis.moe.gov.lk  # [REQUIRED]
is_proxy_host:        idp.app.emis.moe.gov.lk
is_proxy_port:        "443"
is_admin_user:        admin
is_admin_password:    changeme                  # [REQUIRED] [VAULT]
is_db_host:           "{{ hostvars[groups['db_host'][0]].ansible_host }}"
is_db_port:           "3306"

# ── WSO2 APIM ────────────────────────────────────────────────
apim_hostname:        apim.app.emis.moe.gov.lk  # [REQUIRED]
apim_proxy_host:      apim.app.emis.moe.gov.lk
apim_proxy_port:      "443"
apim_admin_user:      admin
apim_admin_password:  changeme                   # [REQUIRED] [VAULT]
apim_db_host:         "{{ hostvars[groups['db_host'][0]].ansible_host }}"
apim_db_port:         "3306"
apim_gateway_url:     services.app.emis.moe.gov.lk

# ── Backend (Laravel) ────────────────────────────────────────
app_name:    EMIS
app_env:     production
app_key:     base64:changeme==                  # [REQUIRED] [VAULT] — generate: php artisan key:generate --show
app_debug:   "false"
app_url:     https://api.emis.moe.gov.lk        # [REQUIRED]

db_host:     "{{ hostvars[groups['db_host'][0]].ansible_host }}"
db_port:     "3306"
db_database: "{{ mysql_emis_db }}"
db_username: "{{ mysql_emis_user }}"
db_password: "{{ mysql_emis_password }}"

wso2_enabled:    "True"
wso2_base_url:   "https://{{ is_hostname }}"
wso2_verify_ssl: "False"
# Populated after configure-emis-app.yml runs — paste output here, then re-run 05:
wso2_m2m_client_id:     ""                      # [REQUIRED] set after playbook 07
wso2_m2m_client_secret: ""                      # [REQUIRED] [VAULT] set after playbook 07
wso2_teacher_role_id:   ""                      # [REQUIRED] set after playbook 07

# ASGARDEO_* vars in backend.env are derived from is_hostname and wso2_m2m_client_id/secret above.
# No extra variables needed here.

memcached_host: memcached

# ── Frontend (Vite — baked at image build time) ──────────────
vite_asgardeo_base_url:  "https://{{ is_hostname }}"
vite_asgardeo_client_id: ""                     # [REQUIRED] set after playbook 07 — consumer key of "EMIS Web App"
vite_signin_redirect_url:  https://app.emis.moe.gov.lk/authentication/callback
vite_signout_redirect_url: https://app.emis.moe.gov.lk/logout
vite_api_base_url:         https://services.app.emis.moe.gov.lk/hrm/1.0.0

# ── IS / APIM key manager registration ──────────────────────
km_name:           emis-prod
km_description:    "EMIS Production IS 7 Key Manager"

# ── EMIS application resources (used by configure-emis-app) ─
nemis_roles:
  - Teacher
  - Principal
  - DataEntry

nemis_users:
  - username:    teacher1
    password:    Teacher@123              # [VAULT] use strong passwords in prod
    first_name:  Teacher
    last_name:   One
    email:       teacher1@emis.moe.gov.lk
    roles:       [Teacher]
  - username:    principal1
    password:    Principal@123            # [VAULT]
    first_name:  Principal
    last_name:   One
    email:       principal1@emis.moe.gov.lk
    roles:       [Principal]
  - username:    dataentry1
    password:    DataEntry@123            # [VAULT]
    first_name:  DataEntry
    last_name:   One
    email:       dataentry1@emis.moe.gov.lk
    roles:       [DataEntry]

nemis_apis:
  - name:        EMIS-HRM
    version:     v1.0.0
    context:     /hrm
    backend_url: "https://api.emis.moe.gov.lk/api/"
    openapi_url: "https://api.emis.moe.gov.lk/api/openapi.json"

nemis_apps:
  - name:          "EMIS Web App"
    grant_types:   [authorization_code, refresh_token]
    callback_url:  "https://app.emis.moe.gov.lk/authentication/callback"
    public_client: true
  - name:          "CEMIS-LK M2M"
    grant_types:   [client_credentials]
    callback_url:  ""
    public_client: false
