- name: Setup MySQL databases for WSO2
  hosts: databases
  become: yes
  vars_files:
    - "{{ playbook_dir }}/vars_files/vars.yml"
  gather_facts: false
  collections:
    - community.mysql
  vars:
    mysql_host: "{{ varsfl_myql_host  | default('127.0.0.1', true) }}"
    mysql_port: "{{ varsfl_mysql_port | default(3306, true) }}"
    mysql_user: "{{ varsfl_mysql_root_user }}"
    mysql_password: "{{ varsfl_mysql_root_password }}"
    mysql_user_configured: "{{ varsfl_mysql_user_configured | default('wso2user', true) }}"
    mysql_user_configured_password: "{{ varsfl_mysql_user_configured_password | default('wso2pass', true) }}"
    # Database names from vars_files/vars.yml
    mysql_apim_db: "{{ varsfl_mysql_apim_db | default('wso2_apim_db', true) }}"
    mysql_apim_shared_db: "{{ varsfl_mysql_apim_shared_db | default('wso2_apim_shared_db', true) }}"
    mysql_is_db: "{{ varsfl_mysql_is_db | default('wso2_is_db', true) }}"
    mysql_is_shared_db: "{{ varsfl_mysql_is_shared_db | default('wso2_is_shared_db', true) }}"
    # Paths
    resources_dir: "{{ playbook_dir }}/resources"
    remote_tmp_dir: "/tmp/sql_imports"
    # APIM scripts
    apim_db_script: "{{ remote_tmp_dir }}/wso2_apim_4.6.0_db_script.sql"
    apim_shared_db_script: "{{ remote_tmp_dir }}/wso2_apim_4.6.0_shared_db_script.sql"
    # IS scripts
    is_identity_db_script: "{{ remote_tmp_dir }}/wso2_is_7.2.0_identity_db_script.sql"
    is_consent_db_script: "{{ remote_tmp_dir }}/wso2_is_7.2.0_consent_db_script.sql"
    is_shared_db_script: "{{ remote_tmp_dir }}/wso2_is_7.2.0_shared_db_script.sql"

    

  tasks:
    - name: Ensure PyMySQL client is installed for MySQL modules
      ansible.builtin.package:
        name: python3-pymysql
        state: present
      run_once: true

    # create /temp/sql_imports directory on remote
    - name: Create a temporary directory on the remote host
      ansible.builtin.file:
        path: "{{ remote_tmp_dir }}"
        state: directory
        mode: '0777'

    # upload all *.sql scripts from resources/ to remote_tmp_dir
    - name: Upload all SQL scripts to the remote host
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ remote_tmp_dir }}/"
        mode: '0644'
      # fileglob to match *.sql
      with_fileglob:
        - "{{ resources_dir }}/*.sql"
      register: uploaded_files



    # Drop all databases if they exist
    - name: Drop all WSO2 databases if they exist
      community.mysql.mysql_db:
        name: "{{ item }}"
        state: absent
        login_host: "{{ mysql_host }}"
        login_port: "{{ mysql_port }}"
        login_user: "{{ mysql_user }}"
        login_password: "{{ mysql_password }}"
      loop:
        - "{{ mysql_apim_db }}"
        - "{{ mysql_apim_shared_db }}"
        - "{{ mysql_is_db }}"
        - "{{ mysql_is_shared_db }}"

    # Create all 4 databases with explicit charset/collation
    - name: Create all WSO2 databases (latin1)
      community.mysql.mysql_query:
        login_host: "{{ mysql_host }}"
        login_port: "{{ mysql_port }}"
        login_user: "{{ mysql_user }}"
        login_password: "{{ mysql_password }}"
        query: >
          CREATE DATABASE IF NOT EXISTS `{{ item }}`
          CHARACTER SET latin1
          COLLATE latin1_swedish_ci;
      loop:
        - "{{ mysql_apim_db }}"
        - "{{ mysql_apim_shared_db }}"
        - "{{ mysql_is_db }}"
        - "{{ mysql_is_shared_db }}"

    # Ensure DB character set/collation are latin1 to avoid oversized indexes
    - name: Force latin1 character set on all WSO2 databases
      community.mysql.mysql_query:
        login_host: "{{ mysql_host }}"
        login_port: "{{ mysql_port }}"
        login_user: "{{ mysql_user }}"
        login_password: "{{ mysql_password }}"
        query: "ALTER DATABASE `{{ item }}` CHARACTER SET latin1 COLLATE latin1_swedish_ci;"
      loop:
        - "{{ mysql_apim_db }}"
        - "{{ mysql_apim_shared_db }}"
        - "{{ mysql_is_db }}"
        - "{{ mysql_is_shared_db }}"

    # Import scripts into APIM DB (product-specific: apimgt/mysql.sql)
    - name: Import APIM schema into APIM DB
      community.mysql.mysql_db:
        name: "{{ mysql_apim_db }}"
        state: import
        target: "{{ apim_db_script }}"
        login_host: "{{ mysql_host }}"
        login_port: "{{ mysql_port }}"
        login_user: "{{ mysql_user }}"
        login_password: "{{ mysql_password }}"

    # Import scripts into APIM shared DB (shared: dbscripts/mysql.sql from APIM)
    - name: Import shared schema into APIM shared DB
      community.mysql.mysql_db:
        name: "{{ mysql_apim_shared_db }}"
        state: import
        target: "{{ apim_shared_db_script }}"
        login_host: "{{ mysql_host }}"
        login_port: "{{ mysql_port }}"
        login_user: "{{ mysql_user }}"
        login_password: "{{ mysql_password }}"

    # Import scripts into IS DB (product-specific: identity/mysql.sql + consent/mysql.sql)
    - name: Import IS identity schema into IS DB
      community.mysql.mysql_db:
        name: "{{ mysql_is_db }}"
        state: import
        target: "{{ is_identity_db_script }}"
        login_host: "{{ mysql_host }}"
        login_port: "{{ mysql_port }}"
        login_user: "{{ mysql_user }}"
        login_password: "{{ mysql_password }}"

    - name: Import IS consent schema into IS DB
      community.mysql.mysql_db:
        name: "{{ mysql_is_db }}"
        state: import
        target: "{{ is_consent_db_script }}"
        login_host: "{{ mysql_host }}"
        login_port: "{{ mysql_port }}"
        login_user: "{{ mysql_user }}"
        login_password: "{{ mysql_password }}"

    # Import scripts into IS shared DB (shared: dbscripts/mysql.sql from IS)
    - name: Import shared schema into IS shared DB
      community.mysql.mysql_db:
        name: "{{ mysql_is_shared_db }}"
        state: import
        target: "{{ is_shared_db_script }}"
        login_host: "{{ mysql_host }}"
        login_port: "{{ mysql_port }}"
        login_user: "{{ mysql_user }}"
        login_password: "{{ mysql_password }}"

    # Grant configured application user full privileges on all databases
    - name: Grant configured MySQL user full privileges on all WSO2 databases
      community.mysql.mysql_user:
        name: "{{ mysql_user_configured }}"
        password: "{{ mysql_user_configured_password }}"
        host: "%"
        priv: "{{ item }}.*:ALL"
        append_privs: yes
        state: present
        login_host: "{{ mysql_host }}"
        login_port: "{{ mysql_port }}"
        login_user: "{{ mysql_user }}"
        login_password: "{{ mysql_password }}"
      loop:
        - "{{ mysql_apim_db }}"
        - "{{ mysql_apim_shared_db }}"
        - "{{ mysql_is_db }}"
        - "{{ mysql_is_shared_db }}"

    - name: Flush MySQL privileges
      community.mysql.mysql_query:
        query: "FLUSH PRIVILEGES"
        login_host: "{{ mysql_host }}"
        login_port: "{{ mysql_port }}"
        login_user: "{{ mysql_user }}"
        login_password: "{{ mysql_password }}"
