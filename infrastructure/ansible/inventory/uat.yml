# [ inventory for UAT Environment
# inventory/uat.yml
all:
  vars:
    # env
    env: uat
    # ansible vars
    ansible_user: ansible
    ansible_port: 22
    ansible_ssh_private_key_file: ~/.ssh/id_rsa
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_common_args: >-
      -o StrictHostKeyChecking=no
      -o ProxyJump=ansible@124.43.177.235

  children:                  
    services:                 
      children:
        # React Frontend                   
        frontend_service:          
          hosts:                   
            uat_frontend:          
              ansible_host: 192.168.200.2
        
        # PHP + Laravel Backend
        backend_service:           
          hosts:                
            uat_backend:           
              ansible_host: 192.168.200.2

        # WSO2 Identity Server
        is_service:                
          hosts:                   
            uat_is:               
              ansible_host: 192.168.200.2

        # WSO2 API Manager
        apim_service:              
          hosts:                   
            uat_apim:            
              ansible_host: 192.168.200.2


    # MYSQL Databases for services
    databases:                
      hosts:                  
        uat_db:               
          ansible_host: 192.168.200.2
