---
# ============================================================
# EMIS No-APIM — WSO2 Identity Server Reset Playbook
# ============================================================
# This playbook performs a full reset of the WSO2 IS:
#   1. Stops the wso2-is service in the Docker stack.
#   2. Drops and recreates the IS databases.
#   3. Restarts the wso2-is service.
#   4. Re-configures the IS (roles, users, apps).
#
# Usage:
#   ansible-playbook deploy-noapim/playbooks/reset-is.yml \
#     -i deploy-noapim/inventory/uat.yml \
#     -e @deploy-noapim/env/uat.yml \
#     --vault-password-file deploy-noapim/.vault_pass
# ============================================================

# ── Step 1: Stop WSO2 IS service ──────────────────────────────────────────────
- name: Stop WSO2 Identity Server service
  hosts: swarm_managers
  become: true
  tasks:
    - name: Scale down wso2-is service to 0
      ansible.builtin.shell: "docker service scale {{ stack_name }}_wso2-is=0"
      register: scale_down
      failed_when: 
        - scale_down.rc != 0 
        - "'no such service' not in scale_down.stderr"

# ── Step 2: Reset WSO2 IS databases ──────────────────────────────────────────
- name: Reset WSO2 IS databases
  ansible.builtin.import_playbook: mysql-setup-wso2-is-only.yml

# ── Step 3: Start WSO2 IS service ─────────────────────────────────────────────
- name: Start WSO2 Identity Server service
  ansible.builtin.import_playbook: deploy-is-only.yml

# ── Step 4: Configure WSO2 IS ─────────────────────────────────────────────────
- name: Configure WSO2 Identity Server
  ansible.builtin.import_playbook: configure-is-only.yml

- name: Post-reset summary
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Print success message
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "WSO2 Identity Server has been RESET and RECONFIGURED."
          - "================================================================"
