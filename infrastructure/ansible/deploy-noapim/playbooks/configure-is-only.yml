- name: Configure IS post-installation (No APIM)
  hosts: swarm_managers
  gather_facts: false
  vars:
    # IS connection settings (local aliases to avoid collisions with env-file vars)
    is_host:       "{{ is_hostname  }}"
    is_port:       "{{ is_port }}"
    is_admin_name: "{{ is_admin_user  }}"
    is_admin_pass: "{{ is_admin_password  }}"

    roles_to_create: "{{ emis_roles }}"
    users_to_create: "{{ emis_users }}"
    apps_to_create:  "{{ emis_apps }}"

  tasks:
    - name: Set IS management base URL (direct container, port 9444)
      ansible.builtin.set_fact:
        is_mgmt: "https://{{ is_hostname }}"

    # =========================================================================
    # PART 1: Wait for IS
    # =========================================================================
    # Use the direct container URL. Accepts 200 or 401 (auth failure = IS is up
    # but credentials may be wrong). A connection error means IS is still
    # starting, which keeps the retry loop going.

    - name: Wait for IS management API to be ready
      ansible.builtin.uri:
        url: "{{ is_mgmt }}/api/server/v1/configs"
        method: GET
        validate_certs: no
        user: "{{ is_admin_name }}"
        password: "{{ is_admin_pass }}"
        force_basic_auth: yes
        status_code: [200, 401]
      register: is_ready
      until: is_ready.status in [200, 401]
      retries: 30
      delay: 10

    # =========================================================================
    # PART 2: Create Roles in IS
    # =========================================================================

    - name: Create roles in IS
      ansible.builtin.uri:
        url: "{{ is_mgmt }}/scim2/v2/Roles"
        method: POST
        validate_certs: no
        user: "{{ is_admin_name }}"
        password: "{{ is_admin_pass }}"
        force_basic_auth: yes
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          displayName: "{{ role }}"
          permissions: []
        status_code: [201, 200, 409]
      loop: "{{ roles_to_create }}"
      loop_control:
        loop_var: role
        label: "{{ role }}"
      when: roles_to_create | length > 0

    - name: Get all role IDs
      ansible.builtin.uri:
        url: "{{ is_mgmt }}/scim2/v2/Roles?filter=displayName+eq+{{ role | urlencode }}"
        method: GET
        validate_certs: no
        user: "{{ is_admin_name }}"
        password: "{{ is_admin_pass }}"
        force_basic_auth: yes
        headers:
          Content-Type: "application/json"
      loop: "{{ roles_to_create }}"
      loop_control:
        loop_var: role
      register: role_lookups
      when: roles_to_create | length > 0

    - name: Map role names to IDs
      set_fact:
        role_id_mapping: "{{ role_id_mapping | default({}) | combine({ item.role: item.json.Resources[0].id }) }}"
      loop: "{{ role_lookups.results }}"
      loop_control:
        label: "{{ item.role }}"
      when:
        - roles_to_create | length > 0
        - item.json is defined
        - item.json.totalResults | default(0) | int > 0

    # =========================================================================
    # PART 3: Create Users in IS
    # =========================================================================

    - name: Create users in IS via SCIM2
      ansible.builtin.uri:
        url: "{{ is_mgmt }}/scim2/Users"
        method: POST
        validate_certs: no
        user: "{{ is_admin_name }}"
        password: "{{ is_admin_pass }}"
        force_basic_auth: yes
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          schemas:
            - "urn:ietf:params:scim:schemas:core:2.0:User"
            - "urn:ietf:params:scim:schemas:extension:enterprise:2.0:User"
          userName: "{{ user.username }}"
          password: "{{ user.password }}"
          name:
            givenName: "{{ user.first_name | default(user.username) }}"
            familyName: "{{ user.last_name | default('') }}"
          emails:
            - value: "{{ user.email | default(user.username + '@localhost') }}"
              primary: true
        status_code: [201, 200, 409]
      loop: "{{ users_to_create | default([]) }}"
      loop_control:
        loop_var: user
        label: "{{ user.username }}"
      when: users_to_create is defined and users_to_create | length > 0

    - name: Get created user IDs for role assignment
      ansible.builtin.uri:
        url: "{{ is_mgmt }}/scim2/Users?filter=userName+eq+{{ user.username }}"
        method: GET
        validate_certs: no
        user: "{{ is_admin_name }}"
        password: "{{ is_admin_pass }}"
        force_basic_auth: yes
        headers:
          Content-Type: "application/json"
      loop: "{{ users_to_create | default([]) }}"
      loop_control:
        loop_var: user
        label: "{{ user.username }}"
      register: user_lookups
      when: users_to_create is defined and users_to_create | length > 0 and (user.roles | default([]) | length > 0)

    - name: Assign roles to users
      ansible.builtin.uri:
        url: "{{ is_mgmt }}/scim2/v2/Roles/{{ role_id_mapping[user_role.1] }}"
        method: PATCH
        validate_certs: no
        user: "{{ is_admin_name }}"
        password: "{{ is_admin_pass }}"
        force_basic_auth: yes
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          schemas:
            - "urn:ietf:params:scim:api:messages:2.0:PatchOp"
          Operations:
            - op: "add"
              path: "users"
              value:
                - value: "{{ user_role.0.json.Resources[0].id }}"
                  display: "{{ user_role.0.user.username }}"
        status_code: [200, 204]
      loop: "{{ user_lookups.results | default([]) | subelements('user.roles', skip_missing=True) }}"
      loop_control:
        loop_var: user_role
        label: "Assigning {{ user_role.1 }} to {{ user_role.0.user.username }}"
      when:
        - user_lookups.results is defined
        - user_lookups.results | length > 0
        - role_id_mapping[user_role.1] is defined

    # =========================================================================
    # PART 4 & 5: Create & Configure OIDC Applications (Modular)
    # All application definitions are sourced from emis_apps in the env file.
    # To add, remove, or reconfigure an app, edit the emis_apps list in
    # env/<environment>.yml — no changes to this playbook are needed.
    # =========================================================================

    # ── Step 1: Idempotency check ─────────────────────────────────────────────
    - name: Check if applications already exist in IS
      ansible.builtin.uri:
        url: "{{ is_mgmt }}/api/server/v1/applications?filter=name+eq+{{ item.name | urlencode }}"
        method: GET
        validate_certs: no
        user: "{{ is_admin_name }}"
        password: "{{ is_admin_pass }}"
        force_basic_auth: yes
        headers:
          Content-Type: "application/json"
      loop: "{{ apps_to_create }}"
      register: app_checks

    - name: Set facts for existing apps
      ansible.builtin.set_fact:
        existing_apps: "{{ existing_apps | default({}) | combine({ item.item.name: (item.json.applications[0].id if item.json.totalResults | default(0) | int > 0 else '') }) }}"
      loop: "{{ app_checks.results }}"

    # ── Step 2: Create new apps ───────────────────────────────────────────────
    - name: Create application in IS
      ansible.builtin.uri:
        url: "{{ is_mgmt }}/api/server/v1/applications"
        method: POST
        validate_certs: no
        user: "{{ is_admin_name }}"
        password: "{{ is_admin_pass }}"
        force_basic_auth: yes
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          name: "{{ item.name }}"
          description: "{{ item.description | default('') }}"
          templateId: "{{ item.template_id if (item.template_id | default('') | length > 0) else omit }}"
          inboundProtocolConfiguration:
            oidc:
              grantTypes: "{{ item.grant_types }}"
              publicClient: "{{ item.public_client | default(false) }}"
              callbackURLs: "{{ ['regexp=(' + item.callback_urls | join('|') + ')'] if (item.callback_urls | length > 1) else (item.callback_urls if (item.callback_urls | length > 0) else omit) }}"
              allowedOrigins: "{{ item.allowed_origins if (item.allowed_origins | length > 0) else omit }}"
        status_code: [201, 409]
      loop: "{{ apps_to_create }}"
      when: existing_apps[item.name] == ''

    # ── Step 3: Re-query and map all final application IDs ───────────────────
    - name: Re-query all application IDs to ensure we have them
      ansible.builtin.uri:
        url: "{{ is_mgmt }}/api/server/v1/applications?filter=name+eq+{{ item.name | urlencode }}"
        method: GET
        validate_certs: no
        user: "{{ is_admin_name }}"
        password: "{{ is_admin_pass }}"
        force_basic_auth: yes
        headers:
          Content-Type: "application/json"
      loop: "{{ apps_to_create }}"
      register: final_app_lookups

    - name: Map final application IDs
      ansible.builtin.set_fact:
        app_ids: "{{ app_ids | default({}) | combine({ item.item.name: item.json.applications[0].id }) }}"
      loop: "{{ final_app_lookups.results }}"
      when: item.json.totalResults | default(0) | int > 0

    # ── Step 4: Configure Claims (optional, per-app) ──────────────────────────
    - name: Configure claims for applications
      ansible.builtin.uri:
        url: "{{ is_mgmt }}/api/server/v1/applications/{{ app_ids[item.name] }}"
        method: PATCH
        validate_certs: no
        user: "{{ is_admin_name }}"
        password: "{{ is_admin_pass }}"
        force_basic_auth: yes
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          claimConfiguration:
            dialect: "{{ item.claims.dialect | default('LOCAL') }}"
            requestedClaims: "{{ item.claims.requested_claims | default([]) }}"
            subject:
              claim:
                uri: "{{ item.claims.subject.uri }}"
              includeUserDomain: "{{ item.claims.subject.include_user_domain | default(false) }}"
              includeTenantDomain: "{{ item.claims.subject.include_tenant_domain | default(false) }}"
              useMappedLocalSubject: "{{ item.claims.subject.use_mapped_local_subject | default(false) }}"
        status_code: [200]
      loop: "{{ apps_to_create }}"
      when:
        - item.claims is defined
        - app_ids[item.name] is defined

    # ── Step 5: Configure Associated Roles (optional, per-app) ───────────────
    - name: Configure organization roles for applications
      ansible.builtin.uri:
        url: "{{ is_mgmt }}/api/server/v1/applications/{{ app_ids[item.name] }}"
        method: PATCH
        validate_certs: no
        user: "{{ is_admin_name }}"
        password: "{{ is_admin_pass }}"
        force_basic_auth: yes
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          associatedRoles:
            allowedAudience: "{{ item.associated_roles.allowed_audience }}"
        status_code: [200]
      loop: "{{ apps_to_create }}"
      when:
        - item.associated_roles is defined
        - app_ids[item.name] is defined

    # ── Step 6: Apply custom OIDC config via PUT (optional, per-app) ──────────
    - name: Get existing OIDC protocol config for custom configurations
      ansible.builtin.uri:
        url: "{{ is_mgmt }}/api/server/v1/applications/{{ app_ids[item.name] }}/inbound-protocols/oidc"
        method: GET
        validate_certs: no
        user: "{{ is_admin_name }}"
        password: "{{ is_admin_pass }}"
        force_basic_auth: yes
        headers:
          Content-Type: "application/json"
        status_code: [200]
      loop: "{{ apps_to_create }}"
      when:
        - item.oidc_custom_config is defined
        - app_ids[item.name] is defined
      register: custom_oidc_existing

    - name: Configure OIDC custom protocols
      ansible.builtin.uri:
        url: "{{ is_mgmt }}/api/server/v1/applications/{{ app_ids[item.item.name] }}/inbound-protocols/oidc"
        method: PUT
        validate_certs: no
        user: "{{ is_admin_name }}"
        password: "{{ is_admin_pass }}"
        force_basic_auth: yes
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          clientId: "{{ item.json.clientId }}"
          grantTypes: "{{ item.item.grant_types }}"
          callbackURLs: "{{ ['regexp=(' + item.item.callback_urls | join('|') + ')'] if (item.item.callback_urls | length > 1) else (item.item.callback_urls if (item.item.callback_urls is defined and item.item.callback_urls | length > 0) else omit) }}"
          allowedOrigins: "{{ item.item.allowed_origins if (item.item.allowed_origins is defined and item.item.allowed_origins | length > 0) else omit }}"
          publicClient: "{{ item.item.public_client | default(false) }}"
          pkce:
            mandatory: "{{ item.item.oidc_custom_config.pkce.mandatory | default(false) }}"
            supportPlainTransformAlgorithm: "{{ item.item.oidc_custom_config.pkce.support_plain | default(false) }}"
          hybridFlow:
            enable: false
            responseType: "null"
          accessToken:
            type: "{{ item.item.oidc_custom_config.access_token.type | default('JWT') }}"
            userAccessTokenExpiryInSeconds: "{{ item.item.oidc_custom_config.access_token.user_expiry | default(3600) }}"
            applicationAccessTokenExpiryInSeconds: "{{ item.item.oidc_custom_config.access_token.app_expiry | default(3600) }}"
            revokeTokensWhenIDPSessionTerminated: false
            validateTokenBinding: false
            accessTokenAttributes: "{{ item.item.oidc_custom_config.access_token.attributes | default([]) }}"
          refreshToken:
            expiryInSeconds: "{{ item.item.oidc_custom_config.refresh_token.expiry | default(86400) }}"
            renewRefreshToken: false
          idToken:
            expiryInSeconds: "{{ item.item.oidc_custom_config.id_token.expiry | default(3600) }}"
        status_code: [200]
      loop: "{{ custom_oidc_existing.results }}"
      when:
        - not item.skipped | default(false)
        - item.json is defined

    # ── Step 7: Authorize APIs for M2M applications ───────────────────────────
    - name: Gather all M2M API resource identifiers to lookup
      ansible.builtin.set_fact:
        api_identifiers: >-
          {%- set idents = [] -%}
          {%- for app in apps_to_create -%}
            {%- if app.authorized_apis is defined -%}
              {%- for api in app.authorized_apis -%}
                {%- set _ = idents.append(api.identifier) -%}
              {%- endfor -%}
            {%- endif -%}
          {%- endfor -%}
          {{ idents | unique }}

    - name: Lookup API Resource IDs from IS
      ansible.builtin.uri:
        url: "{{ is_mgmt }}/api/server/v1/api-resources?filter=identifier+eq+{{ item | urlencode }}"
        method: GET
        validate_certs: no
        user: "{{ is_admin_name }}"
        password: "{{ is_admin_pass }}"
        force_basic_auth: yes
        headers:
          Content-Type: "application/json"
      loop: "{{ api_identifiers }}"
      register: api_resource_lookups
      when: api_identifiers | length > 0

    - name: Map API Resource identifiers to IDs
      ansible.builtin.set_fact:
        api_resource_ids: "{{ api_resource_ids | default({}) | combine({ item.item: item.json.apiResources[0].id }) }}"
      loop: "{{ api_resource_lookups.results | default([]) }}"
      when:
        - api_identifiers | length > 0
        - item.json is defined
        - item.json.totalResults | default(0) | int > 0

    - name: Authorize APIs for M2M applications
      ansible.builtin.uri:
        url: "{{ is_mgmt }}/api/server/v1/applications/{{ app_ids[item.0.name] }}/authorized-apis"
        method: POST
        validate_certs: no
        user: "{{ is_admin_name }}"
        password: "{{ is_admin_pass }}"
        force_basic_auth: yes
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          id: "{{ api_resource_ids[item.1.identifier] }}"
          policyIdentifier: "{{ item.1.policy | default('RBAC') }}"
          scopes: "{{ item.1.scopes }}"
        status_code: [200, 201, 409]
      loop: "{{ apps_to_create | subelements('authorized_apis', skip_missing=True) }}"
      when:
        - app_ids[item.0.name] is defined
        - api_resource_ids[item.1.identifier] is defined

    # ── Step 8: Harvest credentials from all created apps ────────────────────
    - name: Fetch OIDC credentials for all apps
      ansible.builtin.uri:
        url: "{{ is_mgmt }}/api/server/v1/applications/{{ app_ids[item.name] }}/inbound-protocols/oidc"
        method: GET
        validate_certs: no
        user: "{{ is_admin_name }}"
        password: "{{ is_admin_pass }}"
        force_basic_auth: yes
        headers:
          Content-Type: "application/json"
        status_code: [200]
      loop: "{{ apps_to_create }}"
      when: app_ids[item.name] is defined
      register: all_app_oidc_configs

    - name: Map app names to OIDC credentials
      ansible.builtin.set_fact:
        app_credentials: "{{ app_credentials | default({}) | combine({ item.item.name: item.json }) }}"
      loop: "{{ all_app_oidc_configs.results | default([]) }}"
      when:
        - not item.skipped | default(false)
        - item.json is defined

    - name: Get Teacher role ID from IS
      ansible.builtin.uri:
        url: "{{ is_mgmt }}/scim2/v2/Roles?filter=displayName+eq+Teacher"
        method: GET
        validate_certs: no
        user: "{{ is_admin_name }}"
        password: "{{ is_admin_pass }}"
        force_basic_auth: yes
        headers:
          Content-Type: "application/json"
      register: teacher_role_lookup

    - name: Set Teacher role ID fact
      set_fact:
        teacher_role_id: "{{ teacher_role_lookup.json.Resources[0].id | default('NOT_FOUND') }}"
      when: teacher_role_lookup.json.totalResults | default(0) | int > 0

    # =========================================================================
    # Summary: display all credentials and update env/<deploy_env>.yml
    # =========================================================================

    - name: Display credentials for all created apps
      ansible.builtin.debug:
        msg:
          - "============================================"
          - "App: {{ item.key }}"
          - "  client_id:     {{ item.value.clientId | default('N/A') }}"
          - "  client_secret: {{ item.value.clientSecret | default('N/A (SPA — no secret)') }}"
          - "============================================"
      loop: "{{ app_credentials | default({}) | dict2items }}"

    - name: Display Teacher role ID
      ansible.builtin.debug:
        msg:
          - "============================================"
          - "wso2_teacher_role_id={{ teacher_role_id | default('NOT_FOUND — create Teacher role first') }}"
          - "============================================"
      when: teacher_role_id is defined

    - name: Update env/{{ deploy_env }}.yml with generated credentials
      ansible.builtin.lineinfile:
        path: "{{ playbook_dir }}/../env/{{ deploy_env }}.yml"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - regexp: '^vite_asgardeo_client_id:'
          line: "vite_asgardeo_client_id: \"{{ app_credentials['EMIS Web App'].clientId | default('') }}\""
        - regexp: '^wso2_m2m_client_id:'
          line: "wso2_m2m_client_id:     \"{{ app_credentials['EMIS-HRM M2M'].clientId | default('') }}\""
        - regexp: '^wso2_m2m_client_secret:'
          line: "wso2_m2m_client_secret: \"{{ app_credentials['EMIS-HRM M2M'].clientSecret | default('') }}\""
        - regexp: '^wso2_teacher_role_id:'
          line: "wso2_teacher_role_id:   \"{{ teacher_role_id }}\""
      delegate_to: localhost
      run_once: true
      when:
        - app_credentials is defined
        - app_credentials['EMIS Web App'] is defined
        - app_credentials['EMIS-HRM M2M'] is defined
        - teacher_role_id is defined
        - teacher_role_id != 'NOT_FOUND'

