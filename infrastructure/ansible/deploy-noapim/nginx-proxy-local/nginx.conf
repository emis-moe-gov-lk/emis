worker_processes auto;
events { worker_connections 1024; }

http {
    # Logging
    log_format proxy '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" host="$host" upstream="$upstream_addr"';
    access_log /var/log/nginx/access.log proxy;
    error_log  /var/log/nginx/error.log warn;

    # Required for the WSO2 carbon console + portals (cookies + redirect URLs)
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # WSO2 upstream uses a self-signed cert; don't verify
    proxy_ssl_verify       off;
    proxy_ssl_server_name  on;
    # SNI must be the public hostname, not the swarm service name:
    # Java's TLS stack rejects SNI containing underscores (noapim_wso2-is)
    # with an "illegal parameter" alert -> nginx 502.
    proxy_ssl_name         $host;

    # Larger buffer for WSO2 carbon console responses
    proxy_buffer_size      16k;
    proxy_buffers          8 16k;
    client_max_body_size   50m;

    # Resolve swarm service names at request time via Docker's embedded DNS
    # (upstreams may not exist yet when the proxy starts).
    resolver 127.0.0.11 valid=10s;

    # ── Frontend (React app) ───────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name app-uat.emis.moe.gov.lk;
        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        location / {
            set $upstream_frontend noapim_frontend;
            proxy_pass http://$upstream_frontend:80;
        }
    }

    # ── Backend (Laravel via FrankenPHP) ───────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name api-uat.emis.moe.gov.lk;
        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        location / {
            set $upstream_backend noapim_backend;
            proxy_pass http://$upstream_backend:80;
        }
    }

    # ── WSO2 Identity Server (carbon + console + my-account) ───────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name idp.app-uat.emis.moe.gov.lk;
        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        location / {
            # WSO2 IS uses port offset 1 → listens on 9444 inside the container.
            set $upstream_is noapim_wso2-is;
            proxy_pass https://$upstream_is:9444;
        }
    }
}
