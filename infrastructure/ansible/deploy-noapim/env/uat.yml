---
# ============================================================
# EMIS Deployment Environment — UAT (No APIM)
# ============================================================
# Generated from deploy-proto/env/uat.yml with APIM vars removed.
# Credentials marked [VAULT] should be encrypted before committing:
#   ansible-vault encrypt_string 'value' --name 'key'
# Run:
#   ansible-playbook deploy-noapim/playbooks/<play>.yml \
#     -i deploy-noapim/inventory/uat.yml \
#     -e @deploy-noapim/env/uat.yml \
#     --vault-password-file deploy-noapim/.vault_pass
# ============================================================

# ── Stack identity ───────────────────────────────────────────
stack_name: emis-uat-nevada
deploy_env: uat
stack_deploy_path: /opt/emis-nevada

# ── Docker image tags ────────────────────────────────────────
frontend_image_repo: ghcr.io/emis-moe-gov-lk/emis-frontend
frontend_image_tag:  "0.1.1"
backend_image_repo:  ghcr.io/emis-moe-gov-lk/emis-backend
backend_image_tag:   "0.5.6.1"
is_image_repo:       ghcr.io/emis-moe-gov-lk/emis-is
is_image_tag:        7.2.0-0.4.2

# ── Docker registry auth ─────────────────────────────────────
registry_host:     ghcr.io
registry_username: emis-moe-gov-lk             # [REQUIRED] GitHub username / PAT owner
registry_password: changeme                    # [REQUIRED] [VAULT] GitHub PAT with read:packages

# ── MySQL — EMIS database ────────────────────────────────────
mysql_root_password: root                      # [VAULT] in real deploys
mysql_emis_db:       emis-uat
mysql_emis_user:     emis-user
mysql_emis_password: EmisUser0                 # [VAULT]
mysql_bind_address:  0.0.0.0

# ── MySQL — WSO2 IS databases ────────────────────────────────
mysql_wso2_user:          wso2-user
mysql_wso2_password:      "WSO2@User4"         # [VAULT]
mysql_is_db:              wso2_is_db
mysql_is_shared_db:       wso2_is_shared_db

# ── WSO2 IS ──────────────────────────────────────────────────
is_hostname:          idp.app-uat.emis.moe.gov.lk
is_proxy_host:        idp.app-uat.emis.moe.gov.lk
is_proxy_port:        "443"
is_admin_user:        admin
is_admin_password:    ADMIN11                  # [VAULT]
is_db_host:           "{{ hostvars[groups['db_host'][0]].ansible_host }}"
is_db_port:           "3306"

# ── Backend (Laravel) ────────────────────────────────────────
app_name:    EMIS
app_env:     production
app_key:     base64:MO/xhx7kxXI/6zErGCUHSQctAORLnFlUEZZXPKQlrYQ=  # [VAULT]
app_debug:   "false"
app_url:     https://api-uat.emis.moe.gov.lk

db_host:     "{{ hostvars[groups['db_host'][0]].ansible_host }}"
db_port:     "3306"
db_database: "{{ mysql_emis_db }}"
db_username: "{{ mysql_emis_user }}"
db_password: "{{ mysql_emis_password }}"

wso2_enabled:    "True"
wso2_base_url:   "https://{{ is_hostname }}"
wso2_verify_ssl: "False"
# Populated after configure-is-only.yml runs — paste output here, then re-run deploy-stack:
wso2_m2m_client_id:     ""
wso2_m2m_client_secret: ""                    # [VAULT] once known
wso2_teacher_role_id:   ""

memcached_host: memcached

# ── Frontend (Vite — baked at image build time) ──────────────
vite_asgardeo_base_url:  "https://{{ is_hostname }}"
vite_asgardeo_client_id: ""                   # set after configure-is-only.yml — consumer key of "EMIS Web App"
vite_signin_redirect_url:  https://app-uat.emis.moe.gov.lk/authentication/callback
vite_signout_redirect_url: https://app-uat.emis.moe.gov.lk/logout
# Direct backend URL — no APIM gateway in this topology
vite_api_base_url:         https://api-uat.emis.moe.gov.lk/api

# ── EMIS application resources (used by configure-is-only) ──
nemis_roles:
  - Teacher
  - Principal
  - DataEntry

nemis_users:
  - username:    teacher1
    password:    Teacher@123
    first_name:  Teacher
    last_name:   One
    email:       teacher1@emis.moe.gov.lk
    roles:       [Teacher]
  - username:    principal1
    password:    Principal@123
    first_name:  Principal
    last_name:   One
    email:       principal1@emis.moe.gov.lk
    roles:       [Principal]
  - username:    dataentry1
    password:    DataEntry@123
    first_name:  DataEntry
    last_name:   One
    email:       dataentry1@emis.moe.gov.lk
    roles:       [DataEntry]

# OIDC apps created directly in IS (no APIM devportal)
nemis_apps:
  - name:          "EMIS Web App"
    grant_types:   [authorization_code, refresh_token]
    callback_url:  "https://app-uat.emis.moe.gov.lk/authentication/callback"
    public_client: true
  - name:          "CEMIS-LK M2M"
    grant_types:   [client_credentials]
    callback_url:  ""
    public_client: false
