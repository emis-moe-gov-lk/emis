---
all:
  vars:
    ansible_user: ansible
    ansible_private_key_file: ~/.ssh/emis_key

  children:

    # ── Jumpbox (public-facing, no proxy hop) ───────────────────────
    jumpbox:
      hosts:
        prod-jump:
          ansible_host: __PROD_JUMPBOX_PUBLIC_IP__
          ansible_user: jump_user
          ansible_private_key_file: ~/.ssh/jump_key
          ansible_ssh_common_args: ""

    # ── All private hosts (routed through jumpbox) ──────────────────
    private_hosts:
      vars:
        ansible_ssh_common_args: >-
          -o StrictHostKeyChecking=no
          -o ProxyJump=jump_user@__PROD_JUMPBOX_PUBLIC_IP__
      children:

        swarm_managers:
          hosts:
            prod-manager:
              ansible_host: __PROD_MANAGER_PRIVATE_IP__

        swarm_workers:
          hosts:
            prod-worker-1:
              ansible_host: __PROD_WORKER_1_PRIVATE_IP__
            prod-worker-2:
              ansible_host: __PROD_WORKER_2_PRIVATE_IP__
            # add more workers here

        db_host:
          hosts:
            prod-db:
              ansible_host: __PROD_DB_PRIVATE_IP__
