# OIDC apps created directly in IS (no APIM devportal)
emis_apps:
  - name: "EMIS Web App"
    description: "EMIS Frontend SPA"
    template_id: ""
    public_client: true
    grant_types:
      - "authorization_code"
      - "refresh_token"
    callback_urls:
      - "{{ frontend_url }}/authentication/callback"
      - "{{ frontend_url }}/logout"
      - "https://localhost:5173/authentication/callback"
      - "https://localhost:5173/logout"
    allowed_origins:
      - "{{ frontend_url }}"
      - "https://localhost:5173"
    claims:
      dialect: "LOCAL"
      requested_claims:
        - claim:
            uri: "http://wso2.org/claims/emailaddress"
          mandatory: false
        - claim:
            uri: "http://wso2.org/claims/roles"
          mandatory: false
      subject:
        uri: "http://wso2.org/claims/userid"
        include_user_domain: false
        include_tenant_domain: false
        use_mapped_local_subject: false
    associated_roles:
      allowed_audience: "ORGANIZATION"
    oidc_custom_config:
      pkce:
        mandatory: false
        support_plain: false
      access_token:
        type: "JWT"
        user_expiry: 3600
        app_expiry: 3600
        attributes:
          - "email"
          - "given_name"
          - "roles"
      refresh_token:
        expiry: 86400
      id_token:
        expiry: 3600

  - name: "EMIS-HRM M2M"
    description: "Machine-to-Machine application for SCIM2 API access"
    template_id: "m2m-application"
    public_client: false
    grant_types:
      - "client_credentials"
    callback_urls: []
    allowed_origins: []
    authorized_apis:
      - identifier: "/scim2/Users"
        policy: "RBAC"
        scopes:
          - "internal_user_mgt_create"
          - "internal_user_mgt_update"
      - identifier: "/scim2/Roles"
        policy: "RBAC"
        scopes:
          - "internal_role_mgt_update"
          - "internal_role_mgt_users_update"

  - name: "EMIS Mobile App- TEST"
    description: "SPA APP TEST - TEST"
    template_id: "mobile-application"
    public_client: true
    grant_types:
      - "authorization_code"
      - "refresh_token"
    callback_urls:
      - "{{ frontend_url }}"
      - "lk.gov.moe.emis-hr://logoutcallback"
      - "lk.gov.moe.emis-hr://callback"
    allowed_origins:
      - "{{ frontend_url }}"
      - "https://localhost:8090"
    associated_roles:
      allowed_audience: "ORGANIZATION"
    oidc_custom_config:
      pkce:
        mandatory: false
        support_plain: false
      access_token:
        type: "JWT"
        user_expiry: 3600
        app_expiry: 3600
        attributes:
          - "email"
          - "given_name"
          - "roles"
      refresh_token:
        expiry: 86400
      id_token:
        expiry: 3600

# ── APIM DevPortal applications (used by configure-apim / configure-apim-apis-appsub) ──
emis_apim_apps:
  - name: "EMIS API Consumer"
    description: "Backend API consumer app"
    throttling_policy: "Unlimited"
    token_type: "JWT"
    grant_types:
      - "authorization_code"
      - "refresh_token"
    callback_url: "{{ frontend_url }}/authentication/callback"
    token_expiry: 3600
    refresh_token_expiry: 86400
    id_token_expiry: 3600
    scopes: []
    public_client: true
    subscribe_to:
      - "EMIS-HRM-API"

# ── APIM APIs to import and publish (used by configure-apim-apis-appsub) ──
emis_apis:
  - name: "EMIS-HRM-API"
    version: "1.0.0"
    context: "/emis-hrm/1.0.0"
    endpoint_url: "{{ backend_url }}"
    openapi_url: "{{ backend_url }}/api.json"
    subscription_policies:
      - "Unlimited"
