---
all:
  vars:
    ansible_user: slaf-dhaki
    ansible_private_key_file: ~/.ssh/deploy_key
    jumpbox_ip: 124.43.177.235

  children:

    # ── Jumpbox (public-facing, no proxy hop) ───────────────────────
    jumpbox:
      hosts:
        emis-jump:
          ansible_host: "{{ jumpbox_ip }}"

    # ── All private hosts (routed through jumpbox) ──────────────────
    private_hosts:
      vars:
        ansible_ssh_common_args: >-
          -o StrictHostKeyChecking=no
          -o ProxyCommand=ssh -i {{ ansible_private_key_file }} -W %h:%p {{ ansible_user }}@{{ jumpbox_ip }}
      children:

        swarm_managers:
          hosts:
            dev-node:
              ansible_host: 192.168.200.4

        swarm_workers:
          hosts:
            dev-node:              # same VM — manager is also its own worker
              ansible_host: 192.168.200.4

        db_host:
          hosts:
            dev-db:              # MySQL on bare metal of db VM
              ansible_host: 192.168.200.3
