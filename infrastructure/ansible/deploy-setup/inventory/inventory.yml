---
all:
  vars:
    ansible_user: slaf-dhaki
    ansible_private_key_file: /var/home/dhakiweere/.ssh/emis_vmaccess_ed25519

  children:

    # ── Jumpbox (public-facing, no proxy hop) ───────────────────────
    jumpbox:
      hosts:
        emis-jump:
          ansible_host: 124.43.177.235
          ansible_user: slaf-dhaki
          ansible_private_key_file: /var/home/dhakiweere/.ssh/emis_vmaccess_ed25519
          ansible_ssh_common_args: ""

    # ── All private hosts (routed through jumpbox) ──────────────────
    private_hosts:
      vars:
        ansible_ssh_common_args: >-
          -o StrictHostKeyChecking=no
          -o ProxyCommand="ssh -i /var/home/dhakiweere/.ssh/emis_vmaccess_ed25519 -o StrictHostKeyChecking=no -W %h:%p slaf-dhaki@124.43.177.235"
      children:

        swarm_managers:
          hosts:
            dev-node:
              ansible_host: 192.168.200.4

        swarm_workers:
          hosts:
            dev-node:              # same VM — manager is also its own worker
              ansible_host: 192.168.200.4

        db_host:
          hosts:
            dev-db:              # MySQL on bare metal of db  VM
              ansible_host: 192.168.200.3
