---
# ---PLAY-DEPLOY-STACK-ROTATE-LOCAL-----
# Copies updated .env (image tags) from docker-swarm/ and redeploys the stack.
# Service env files and docker-stack.yml are assumed to already exist on the server.
- name: Rotate Docker stack images
  hosts: swarm_managers
  become: true
  vars:
    deploy_path: "{{ stack_deploy_path | default('/opt/emis-local') }}"
    stack_file:  "{{ deploy_path }}/docker-stack.yml"
    local_swarm_dir: "{{ playbook_dir }}/../../../docker-swarm"
    repo_root: "{{ playbook_dir }}/../../../.."

  tasks:
    - name: Copy updated .env (image tags) to deploy path
      ansible.builtin.copy:
        src: "{{ local_swarm_dir }}/.env"
        dest: "{{ deploy_path }}/.env"
        mode: '0644'

    - name: Build missing local Docker images
      ansible.builtin.shell: |
        set -a
        source {{ deploy_path }}/.env
        set +a
        for pair in \
          "${FRONTEND_DOCKERIMG_REPO}:${FRONTEND_DOCKERIMG_TAG} frontend" \
          "${BACKEND_DOCKERIMG_REPO}:${BACKEND_DOCKERIMG_TAG} backend" \
          "${WSO2_IS_DOCKERIMG_REPO}:${WSO2_IS_DOCKERIMG_TAG} is" \
          "${WSO2_APIM_DOCKERIMG_REPO}:${WSO2_APIM_DOCKERIMG_TAG} apim"; do
          img="${pair% *}"
          ctx="${pair#* }"
          if ! docker image inspect "$img" >/dev/null 2>&1; then
            echo "Building $img from {{ repo_root }}/${ctx}..."
            docker build -t "$img" "{{ repo_root }}/${ctx}"
          else
            echo "Image $img already exists, skipping build."
          fi
        done
      args:
        executable: /bin/bash
      register: build_result
      changed_when: "'Building' in build_result.stdout"

    - name: Deploy Docker stack with rotated images
      ansible.builtin.shell: |
        set -a
        source {{ deploy_path }}/.env
        set +a
        docker stack deploy -c {{ stack_file }} {{ stack_name }}
      args:
        executable: /bin/bash
      register: stack_deploy_result

    - name: Show deploy output
      ansible.builtin.debug:
        var: stack_deploy_result.stdout_lines
