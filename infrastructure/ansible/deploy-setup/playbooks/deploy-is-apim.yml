---
# ---PLAY-DEPLOY-IS-APIM------------------------------------------------
# Renders essential env files and deploys WSO2 IS + APIM Docker stack.
# Frontend and backend are deployed later via deploy-stack.yml.
- name: Render environment files and deploy IS+APIM Docker stack
  hosts: swarm_managers
  become: true
  vars:
    deploy_path: "{{ stack_deploy_path | default('/opt/emis-noapim') }}"
    stack_file: "{{ deploy_path }}/docker-stack-is-apim.yml"

  tasks:
    - name: Ensure stack deploy directory exists
      ansible.builtin.file:
        path: "{{ deploy_path }}"
        state: directory
        mode: '0755'

    - name: Render docker.env (.env for image tags)
      ansible.builtin.template:
        src:  ../templates/docker.env.j2
        dest: "{{ deploy_path }}/.env"
        mode: '0600'

    - name: Render is.env
      ansible.builtin.template:
        src:  ../templates/is.env.j2
        dest: "{{ deploy_path }}/is.env"
        mode: '0600'

    - name: Render apim.env
      ansible.builtin.template:
        src:  ../templates/apim.env.j2
        dest: "{{ deploy_path }}/apim.env"
        mode: '0600'

    - name: Copy IS+APIM docker-stack file
      ansible.builtin.copy:
        src: "../../../docker-swarm/docker-stack-is-apim.yml"
        dest: "{{ stack_file }}"
        mode: '0644'

    - name: Deploy IS+APIM Docker stack
      ansible.builtin.shell: |
        set -a
        source {{ deploy_path }}/.env
        set +a
        docker stack deploy -c {{ stack_file }} {{ stack_name }}
      args:
        executable: /bin/bash
      register: deploy_result

    - name: Show deploy output
      ansible.builtin.debug:
        var: deploy_result.stdout_lines
