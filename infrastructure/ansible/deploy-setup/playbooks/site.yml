---
# ============================================================
# EMIS — Local Deployment Orchestration
# ============================================================
# Runs deployment steps in order:
#   1. Pre-flight checks (Docker, Swarm)
#   2. Deploy full stack (MySQL + IS + APIM + frontend + backend)
#      MySQL container auto-creates databases via init scripts.
#   3. Configure IS: roles, users, OIDC apps
#      Harvested M2M credentials are written back to
#      docker-swarm/backend.env and frontend.env.
#   4. Configure APIM: register IS as Key Manager, create DevPortal apps
#   5. Redeploy full stack — picks up updated M2M creds from docker-swarm/
#   6. Configure APIM: import APIs, subscribe apps, generate keys, DCR sync
#
# Usage:
#   ansible-playbook playbooks/site.yml \
#     -i inventory/inventory-local.yml \
#     -e @env/env-local.yml \
#     --vault-password-file .vault_pass
# ============================================================

# -- Step 1: Pre-flight checks --
- import_playbook: pre-check.yml

# -- Step 2: Deploy full stack (MySQL, IS, APIM, frontend, backend) --
- import_playbook: deploy-stack.yml

# -- Step 3: Configure IS (roles, users, OIDC apps → writes creds to docker-swarm/) --
- import_playbook: configure-is.yml

# -- Step 4: Configure APIM (register IS as Key Manager, create DevPortal app shells) --
- import_playbook: configure-apim-km-apps.yml

# -- Step 5: Redeploy full stack (picks up updated M2M creds from backend.env) --
- import_playbook: deploy-stack.yml

# -- Step 6: Configure APIM (API import, subscriptions, OAuth keys, DCR sync) --
- import_playbook: configure-apim-apis-appsub.yml

# -- Post-deployment summary --
- name: Post-deployment — status summary
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Print success message
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "EMIS local stack successfully deployed."
          - "================================================================"
