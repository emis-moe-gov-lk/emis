---
# ============================================================
# EMIS — Master Deployment Orchestration
# ============================================================
# Runs all deployment steps in order:
#   1. Pre-flight SSH / become checks
#   2. Install MySQL
#   3. Create EMIS application database
#   4. Create WSO2 IS databases and import schemas
#   5. Create WSO2 APIM database and import schemas (APIM envs only)
#   6. Render env files and deploy IS-only Docker stack
#   7. Configure IS: roles, users, OIDC apps — display credentials
#   8. Deploy full stack (IS + APIM + frontend + backend)
#
# Usage:
#   ansible-playbook playbooks/site.yml \
#     -i inventory/inventory.yml \
#     -e @env/env.yml \
#     --vault-password-file .vault_pass
#
# After site.yml completes:
#   - Copy the client_id / client_secret values printed by Step 7
#   - Paste them into env/env.yml
#   - Re-run deploy-stack.yml alone to push the updated credentials:
#       ansible-playbook playbooks/deploy-stack.yml \
#         -i inventory/inventory.yml \
#         -e @env/env.yml \
#         --vault-password-file .vault_pass
# ============================================================

# -- Step 1: Pre-flight checks --
- import_playbook: pre-check.yml

# -- Step 2: Install MySQL 8.0 --
- import_playbook: mysql-install.yml

# -- Step 3: Create EMIS application database and user --
- import_playbook: mysql-setup-emis-db.yml

# -- Step 4: Create WSO2 IS databases and import schemas --
- import_playbook: mysql-setup-wso2-is-only.yml

# -- Step 5: Create WSO2 APIM database and import schemas --
- import_playbook: mysql-setup-wso2-apim.yml

# -- Step 6: Render env files and deploy IS-only Docker stack --
- import_playbook: deploy-is-only.yml

# -- Step 7: Configure IS (roles, users, OIDC apps) --
- import_playbook: configure-is-only.yml

# -- Step 8: Deploy full stack with updated credentials --
- import_playbook: deploy-stack.yml

# -- Post-deployment summary --
- name: Post-deployment — status summary
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Print success message
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "EMIS stack successfully deployed on {{ deploy_env }}."
          - "================================================================"
