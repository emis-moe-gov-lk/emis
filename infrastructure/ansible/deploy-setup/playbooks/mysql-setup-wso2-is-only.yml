---
# ---PLAY-SETUP-MYSQL-WSO2-IS-ONLY-----
# Creates only the WSO2 Identity Server databases (no APIM databases).
- name: Setup MySQL databases for WSO2 IS
  hosts: db_host
  become: yes
  gather_facts: false
  collections:
    - community.mysql
  vars:
    mysql_root_user_val: "{{ mysql_root_user | default('root') }}"
    mysql_socket:        /var/run/mysqld/mysqld.sock
    resources_dir:       "../resources"
    remote_tmp_dir:      "/tmp/sql_imports_noapim"
    is_identity_db_script: "{{ remote_tmp_dir }}/wso2_is_7.2.0_identity_db_script.sql"
    is_consent_db_script:  "{{ remote_tmp_dir }}/wso2_is_7.2.0_consent_db_script.sql"
    is_shared_db_script:   "{{ remote_tmp_dir }}/wso2_is_7.2.0_shared_db_script.sql"

  tasks:
    - name: Ensure PyMySQL client is installed
      ansible.builtin.package:
        name: python3-pymysql
        state: present

    - name: Create temporary directory on remote host
      ansible.builtin.file:
        path: "{{ remote_tmp_dir }}"
        state: directory
        mode: '0777'

    - name: Upload IS SQL scripts to remote host
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ remote_tmp_dir }}/"
        mode: '0644'
      with_fileglob:
        - "{{ resources_dir }}/wso2_is_*.sql"

    - name: Drop IS databases if they exist
      community.mysql.mysql_db:
        name: "{{ item }}"
        state: absent
        login_unix_socket: "{{ mysql_socket }}"
        login_user: "{{ mysql_root_user_val }}"
        login_password: "{{ mysql_root_password }}"
      loop:
        - "{{ mysql_is_db }}"
        - "{{ mysql_is_shared_db }}"

    - name: Create IS databases (latin1)
      community.mysql.mysql_query:
        login_unix_socket: "{{ mysql_socket }}"
        login_user: "{{ mysql_root_user_val }}"
        login_password: "{{ mysql_root_password }}"
        query: >
          CREATE DATABASE IF NOT EXISTS `{{ item }}`
          CHARACTER SET latin1
          COLLATE latin1_swedish_ci;
      loop:
        - "{{ mysql_is_db }}"
        - "{{ mysql_is_shared_db }}"

    - name: Force latin1 character set on IS databases
      community.mysql.mysql_query:
        login_unix_socket: "{{ mysql_socket }}"
        login_user: "{{ mysql_root_user_val }}"
        login_password: "{{ mysql_root_password }}"
        query: "ALTER DATABASE `{{ item }}` CHARACTER SET latin1 COLLATE latin1_swedish_ci;"
      loop:
        - "{{ mysql_is_db }}"
        - "{{ mysql_is_shared_db }}"

    - name: Import IS identity schema
      community.mysql.mysql_db:
        name: "{{ mysql_is_db }}"
        state: import
        target: "{{ is_identity_db_script }}"
        login_unix_socket: "{{ mysql_socket }}"
        login_user: "{{ mysql_root_user_val }}"
        login_password: "{{ mysql_root_password }}"

    - name: Import IS consent schema
      community.mysql.mysql_db:
        name: "{{ mysql_is_db }}"
        state: import
        target: "{{ is_consent_db_script }}"
        login_unix_socket: "{{ mysql_socket }}"
        login_user: "{{ mysql_root_user_val }}"
        login_password: "{{ mysql_root_password }}"

    - name: Import IS shared schema
      community.mysql.mysql_db:
        name: "{{ mysql_is_shared_db }}"
        state: import
        target: "{{ is_shared_db_script }}"
        login_unix_socket: "{{ mysql_socket }}"
        login_user: "{{ mysql_root_user_val }}"
        login_password: "{{ mysql_root_password }}"

    - name: Grant WSO2 user full privileges on IS databases
      community.mysql.mysql_user:
        name: "{{ mysql_wso2_user }}"
        password: "{{ mysql_wso2_password }}"
        host: "%"
        priv: "{{ item }}.*:ALL"
        append_privs: yes
        state: present
        login_unix_socket: "{{ mysql_socket }}"
        login_user: "{{ mysql_root_user_val }}"
        login_password: "{{ mysql_root_password }}"
      loop:
        - "{{ mysql_is_db }}"
        - "{{ mysql_is_shared_db }}"

    - name: Flush MySQL privileges
      community.mysql.mysql_query:
        query: "FLUSH PRIVILEGES"
        login_unix_socket: "{{ mysql_socket }}"
        login_user: "{{ mysql_root_user_val }}"
        login_password: "{{ mysql_root_password }}"
