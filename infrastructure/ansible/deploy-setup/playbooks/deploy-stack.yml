---
# ---PLAY-DEPLOY-STACK-LOCAL-----
# Copies pre-baked env files and stack YAMLs from docker-swarm/ to the deploy
# directory, then deploys the Docker Swarm stack. No Jinja2 template rendering.
- name: Deploy full Docker stack
  hosts: swarm_managers
  become: true
  vars:
    deploy_path: "{{ stack_deploy_path | default('/opt/emis-local') }}"
    stack_file:  "{{ deploy_path }}/docker-stack.yml"
    local_swarm_dir: "{{ playbook_dir }}/../../../docker-swarm"

  tasks:
    - name: Ensure stack deploy directory exists
      ansible.builtin.file:
        path: "{{ deploy_path }}"
        state: directory
        mode: '0755'

    - name: Copy docker-swarm files to deploy path
      ansible.builtin.copy:
        src: "{{ local_swarm_dir }}/"
        dest: "{{ deploy_path }}"
        mode: '0644'

    - name: Deploy Docker stack
      ansible.builtin.shell: |
        set -a
        source {{ deploy_path }}/.env
        set +a
        docker stack deploy -c {{ stack_file }} {{ stack_name }}
      args:
        executable: /bin/bash
      register: stack_deploy_result

    - name: Show stack deploy output
      ansible.builtin.debug:
        var: stack_deploy_result.stdout_lines
