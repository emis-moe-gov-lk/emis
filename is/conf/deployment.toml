[server]
hostname = "$env{IS_HOSTNAME}"
node_ip = "127.0.0.1"
offset = 1
base_path = "https://$ref{server.hostname}"

[transport.https.properties]
proxyName= "$env{IS_PROXY_HOST}"
proxyPort = "$env{IS_PROXY_PORT}"

[super_admin]
username = "$env{IS_ADMIN_NAME}"
password = "$env{IS_ADMIN_PASSWORD}"
create_admin_account = true

[user_store]
type = "database_unique_id"

# Relaxed password regex — matches the autogenerated salt string
# from ReservedUserCreationObserver.getSaltString() (uppercase A-Z + digits only).
[user_store.properties]
PasswordJavaRegEx = "^[A-Z0-9]{1,50}$"
PasswordJavaScriptRegEx = "^[A-Z0-9]{1,50}$"

# --- Databases ---
[database.identity_db]
type = "mysql"
url = "jdbc:mysql://$env{IS_DB_HOST}:$env{IS_DB_PORT}/$env{IS_DB_IDENTITY}?useSSL=false&amp;allowPublicKeyRetrieval=true&amp;autoReconnect=true"
username = "$env{IS_DB_WSO2USER_USERNAME}"
password = "$env{IS_DB_WSO2USER_PASSWORD}"

[database.shared_db]
type = "mysql"
url = "jdbc:mysql://$env{IS_DB_HOST}:$env{IS_DB_PORT}/$env{IS_DB_SHARED}?useSSL=false&amp;allowPublicKeyRetrieval=true&amp;autoReconnect=true"
username = "$env{IS_DB_WSO2USER_USERNAME}"
password = "$env{IS_DB_WSO2USER_PASSWORD}"

[agent_identity]
enabled = false

# --- Keystores ---
[keystore.primary]
file_name = "wso2carbon.p12"
password = "wso2carbon"
type = "PKCS12"

[truststore]
file_name = "client-truststore.p12"
password = "wso2carbon"
type = "PKCS12"

# --- Role Management ---
[role_mgt]
allow_system_prefix_for_role = true

# --- Auth endpoint credentials ---
[account_recovery.endpoint.auth]
hash = "66cd9688a2ae068244ea01e70f0e230f5623b7fa4cdecb65070a09ec06452262"

[identity.auth_framework.endpoint]
app_password = "dashboard"

# --- APIM-IS integration: token revocation notification ---
[oauth]
authorize_all_scopes = true

[[event_listener]]
id = "token_revocation"
type = "org.wso2.carbon.identity.core.handler.AbstractIdentityHandler"
name = "org.wso2.is.notification.ApimOauthEventInterceptor"
order = 1

[event_listener.properties]
notification_endpoint = "https://$env{APIM_HOST}:$env{APIM_PORT}/internal/data/v1/notify"
username = "$env{APIM_WSO2USER_USERNAME}"
password = "$env{APIM_WSO2USER_PASSWORD}"
'header.X-WSO2-KEY-MANAGER' = "WSO2-IS"

# --- SCIM2/Me — cross-tenant access for Key Manager user info ---
[[resource.access_control]]
context = "(.*)/scim2/Me"
secure = true
http_method = "GET"
cross_tenant = true
permissions = []
scopes = []

# --- Allow Admin Basic Auth for managing Roles and Users via SCIM2 ---
[[resource.access_control]]
context = "(.*)/scim2/(.*)"
secure = true
http_method = "all"
permissions = ["/permission/admin"]
allowed_auth_handlers = ["BasicAuthentication", "OAuthAuthentication"]

# --- Key Manager operations: DCR (Dynamic Client Registration) ---
[[resource.access_control]]
context = "(.*)/keymanager-operations/dcr/register"
secure = true
http_method = "POST"
permissions = "/permission/admin/manage/identity/applicationmgt/create"
scopes = "internal_application_mgt_create"

[[resource.access_control]]
context = "(.*)/keymanager-operations/dcr/register(.*)"
secure = true
http_method = "GET"
permissions = "/permission/admin/manage/identity/applicationmgt/view"
scopes = "internal_application_mgt_view"

[[resource.access_control]]
context = "(.*)/keymanager-operations/dcr/register(.*)"
secure = true
http_method = "DELETE"
permissions = "/permission/admin/manage/identity/applicationmgt/delete"
scopes = "internal_application_mgt_delete"

[[resource.access_control]]
context = "(.*)/keymanager-operations/dcr/register(.*)"
secure = true
http_method = "PUT"
permissions = "/permission/admin/manage/identity/applicationmgt/update"
scopes = "internal_application_mgt_update"

[[resource.access_control]]
context = "(.*)/keymanager-operations/dcr/register(.*)"
secure = true
http_method = "POST"
permissions = "/permission/admin/manage/identity/applicationmgt/update"
scopes = "internal_application_mgt_update"

# --- Key Manager operations: user info claims ---
[[resource.access_control]]
context = "(.*)/keymanager-operations/user-info/claims(.*)"
secure = true
http_method = "GET"
permissions = "/permission/admin/manage/identity/usermgt/list"
scopes = "internal_user_mgt_list"

[[resource.access_control]]
context = "(.*)/keymanager-operations/user-info/claims/generate"
secure = true
http_method = "POST"
permissions = "/permission/admin/manage/identity/usermgt/list"
scopes = "internal_user_mgt_list"

# --- Tenant context rewrite — keymanager-operations webapp ---
[tenant_context.rewrite]
custom_webapps = ["/keymanager-operations/"]
